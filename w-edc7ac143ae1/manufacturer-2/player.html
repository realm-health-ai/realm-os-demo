<title>Evaluating Your Device</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
  :root {
    --stage: #EEF3F5;
    --panel: #FFFFFF;
    --ink: #101A20;
    --muted: #5B6B75;
    --faint: #8B9CA5;
    --line: #DAE3E7;
    --rule: #C2D0D6;
    --accent: #0C6B70;
    --accent-ink: #075257;
    --accent-wash: #E4F0F0;
    --mark: #C0561B;
    --mark-glow: rgba(192, 86, 27, .18);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #0A1114;
      --panel: #131E23;
      --ink: #EAF1F3;
      --muted: #93A6AE;
      --faint: #6E828B;
      --line: #1E2C33;
      --rule: #2A3C44;
      --accent: #5CBABE;
      --accent-ink: #92D6D9;
      --accent-wash: #0F2729;
      --mark: #E8863F;
      --mark-glow: rgba(232, 134, 63, .20);
    }
  }
  :root[data-theme="dark"] {
    --stage: #0A1114;
    --panel: #131E23;
    --ink: #EAF1F3;
    --muted: #93A6AE;
    --faint: #6E828B;
    --line: #1E2C33;
    --rule: #2A3C44;
    --accent: #5CBABE;
    --accent-ink: #92D6D9;
    --accent-wash: #0F2729;
    --mark: #E8863F;
    --mark-glow: rgba(232, 134, 63, .20);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--stage); color: var(--ink);
    font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app {
    height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: 0;
  }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    padding: 14px 24px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  .chap {
    font: 500 10.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
    color: var(--accent); white-space: nowrap;
  }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(17px, 2.3vw, 24px);
    letter-spacing: -.015em; margin: 0; line-height: 1.2; flex: 1 1 260px; min-width: 0;
  }
  .where { font: 400 12px/1 var(--mono); color: var(--faint); white-space: nowrap; }

  /* ── Stage ────────────────────────────────────────────────── */
  #stage { position: relative; overflow: hidden; margin: 18px 24px 0; }
  #plate {
    position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
    background: #FFFFFF; border: 1px solid var(--line);
  }
  #shot {
    position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform;
    transition: transform .62s cubic-bezier(.22,.61,.36,1);
  }
  .box {
    position: absolute; border: 2px solid var(--mark); border-radius: 4px;
    box-shadow: 0 0 0 3px var(--mark-glow), 0 0 0 9999px rgba(8, 17, 20, .40);
    transition: opacity .3s ease; pointer-events: none;
  }
  /* A title card replaces the plate on the opening and closing steps. */
  #card {
    position: absolute; inset: 0; display: none; place-content: center;
    padding: 6vh 8vw; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px;
  }
  #card.on { display: grid; }
  #card p.eyebrow {
    font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 18px;
  }
  #card h2 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(26px, 4.4vw, 46px);
    line-height: 1.12; letter-spacing: -.022em; margin: 0 0 20px; text-wrap: balance;
  }
  #card dl {
    display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0;
    font-size: 14px; max-width: 46ch;
  }
  #card dt {
    font: 500 10.5px/1.6 var(--sans); letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent);
  }
  #card dd { margin: 0; color: var(--muted); }

  /* ── Caption ──────────────────────────────────────────────── */
  #caption {
    margin: 16px 24px 0; padding: 16px 20px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: clamp(15px, 1.6vw, 20px); line-height: 1.55;
    max-height: 26vh; overflow-y: auto;
  }
  #caption s { color: var(--faint); opacity: .55; text-decoration: none; }
  #caption b { color: var(--ink); font-weight: 500; }

  /* ── Transport ────────────────────────────────────────────── */
  footer { padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn {
    font: 500 13px/1 var(--sans); color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #FFFFFF; }
  .btn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:hover { border-color: var(--rule); color: var(--ink); }
  .clock {
    font: 400 12.5px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    white-space: nowrap;
  }
  .rail { display: flex; gap: 3px; flex: 1 1 220px; min-width: 140px; }
  .tick {
    flex: 1 1 0; height: 20px; padding: 0; border: 0; background: transparent; cursor: pointer;
  }
  .tick i {
    display: block; height: 4px; border-radius: 2px; background: var(--rule);
    transition: background .2s ease;
  }
  .tick[data-state="done"] i { background: var(--accent); }
  .tick[data-state="now"] i { background: var(--mark); height: 6px; margin-top: -1px; }
  .tick:hover i { background: var(--accent-ink); }
  .hint { font: 400 11.5px/1.5 var(--sans); color: var(--faint); white-space: nowrap; }

  @media (max-width: 720px) {
    header { padding: 10px 14px 9px; }
    #stage { margin: 12px 14px 0; }
    #caption { margin: 12px 14px 0; padding: 12px 14px; max-height: 30vh; }
    footer { padding: 10px 14px; gap: 8px; }
    .hint { display: none; }
  }
  /* ?record=1 drives the timeline from a clock and hides the controls, so a headless
     capture does not depend on audio autoplay. */
  body.rec footer, body.rec .hint { display: none; }
  body.rec #caption { max-height: 30vh; }
  @media (prefers-reduced-motion: reduce) {
    #shot { transition: none; }
    .box { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="chap" id="chap"></span>
    <h1 id="title"></h1>
    <span class="where" id="where"></span>
  </header>

  <div id="stage">
    <div id="plate"><img id="shot" alt=""></div>
    <div id="card">
      <div>
        <p class="eyebrow" id="card-eyebrow"></p>
        <h2 id="card-title"></h2>
        <dl id="card-meta"></dl>
      </div>
    </div>
  </div>

  <div id="caption" aria-live="polite"></div>

  <footer>
    <button class="btn primary" id="play">Play</button>
    <button class="btn" id="prev" aria-label="Previous step">Back</button>
    <button class="btn" id="next" aria-label="Next step">Next</button>
    <button class="btn" id="auto" aria-pressed="true">Auto-advance</button>
    <span class="clock" id="clock">0:00 / 0:00</span>
    <div class="rail" id="rail" role="group" aria-label="Steps"></div>
    <span class="hint">Space, arrows, F for fullscreen</span>
  </footer>
  <audio id="au" preload="auto" hidden></audio>
</div>

ut test set", "where": "/datasets", "audio": "play/02.mp4", "dur": 20.62, "sentences": [{"text": "Before training, the developers of AKI-Onset set aside thirty per cent of their cohort and never trained on it.", "start": 0.0, "end": 6.388, "img": "b1-datasets", "rects": [[0.0523, 0.5379, 0.8114, 0.0861]]}, {"text": "That held-out set, sixteen thousand eight hundred and twenty-nine intensive care patients, was converted to the OMOP common data model and is held on the node as a private dataset.", "start": 6.728, "end": 15.868, "img": "b1-datasets", "rects": []}, {"text": "Only its owner, and organisations it is shared with, can evaluate against it.", "start": 16.208, "end": 20.622, "img": "b1-datasets", "rects": []}]}, {"block": 1, "chapter": "Step one", "title": "Your held-out test set", "where": "/datasets", "audio": "play/03.mp4", "dur": 21.19, "sentences": [{"text": "Your workspace may list other datasets too: here, a post-market surveillance dataset for monitoring after release, and data shared with every manufacturer on the node.", "start": 0.0, "end": 9.205, "img": "b1-datasets", "rects": [[0.0523, 0.3842, 0.8114, 0.0861], [0.0523, 0.9539, 0.812, 0.0461]]}, {"text": "Choose the test set deliberately, because it decides what your result can claim.", "start": 9.545, "end": 13.615, "img": "b1-datasets", "rects": []}, {"text": "Your own hold-out shows that the node reproduces your declared performance.", "start": 13.955, "end": 17.311, "img": "b1-datasets", "rects": []}, {"text": "It is not external validation, which needs data from a different site.", "start": 17.651, "end": 21.187, "img": "b1-datasets", "rects": []}]}, {"block": 2, "chapter": "Step two", "title": "Declare the device and its claims", "where": "/cards/new", "audio": "play/04.mp4", "dur": 16.69, "sentences": [{"text": "The model card is the record that the evaluation, and every later review, attaches to.", "start": 0.0, "end": 4.914, "img": "b2-card", "rects": []}, {"text": "State what the device is for, and for whom, in the words a reviewer will hold you to.", "start": 5.254, "end": 9.784, "img": "b2-card", "rects": [[0.0561, 0.3666, 0.6445, 0.0867], [0.0561, 0.567, 0.6445, 0.0642]]}, {"text": "Creating the card mints it on the ledger, so it cannot be deleted afterwards.", "start": 10.124, "end": 13.765, "img": "b2-card", "rects": [[0.0361, 0.1154, 0.9278, 0.045]]}, {"text": "This form is shown filled in, but not submitted.", "start": 14.105, "end": 16.69, "img": "b2-card", "rects": []}]}, {"block": 2, "chapter": "Step two", "title": "Declare the device and its claims", "where": "/cards/new", "audio": "play/05.mp4", "dur": 23.7, "sentences": [{"text": "Then declare your performance claims.", "start": 0.0, "end": 1.846, "img": "b2-card", "rects": []}, {"text": "Each performance claim is a testable statement: a metric, a comparison and a threshold, which the node adjudicates against its own results with a confidence interval.", "start": 2.186, "end": 10.671, "img": "b2-card", "rects": [[0.0561, 0.6762, 0.6445, 0.036]]}, {"text": "Here the claim is on AUROC, the area under the receiver operating characteristic curve, at zero point seven five or above.", "start": 11.011, "end": 17.81, "img": "b2-card", "rects": []}, {"text": "Claim what you can defend, because a claim the node refutes cannot be validated without a recorded justification.", "start": 18.15, "end": 23.695, "img": "b2-card", "rects": []}]}, {"block": 3, "chapter": "Step three", "title": "Bind the certified model", "where": "/cards/8 \u00b7 Model", "audio": "play/06.mp4", "dur": 15.27, "sentences": [{"text": "On the card, associate the certified model you imported in the first walkthrough.", "start": 0.0, "end": 4.14, "img": "b3-model", "rects": [[0.0146, 0.1454, 0.9709, 0.1229]]}, {"text": "Only a certified model can be associated, which is what ties every result on this card to one verified image.", "start": 4.48, "end": 10.408, "img": "b3-model", "rects": []}, {"text": "The card now shows the model, its certification, and the image it is identified by.", "start": 10.748, "end": 15.267, "img": "b3-model", "rects": [[0.0146, 0.2204, 0.9709, 0.048]]}]}, {"block": 4, "chapter": "Step four", "title": "Choose the test set and the evaluation type", "where": "/cards/8 \u00b7 Evaluations", "audio": "play/07.mp4", "dur": 12.16, "sentences": [{"text": "Under Evaluations, choose the AKI hold-out as the dataset and Pre-market validation as the kind of run.", "start": 0.0, "end": 6.242, "img": "b4-evaluate", "rects": [[0.4039, 0.0781, 0.5597, 0.0603]]}, {"text": "Pre-market validation is the labelled outcome evaluation, scored against the outcome recorded for each patient.", "start": 6.582, "end": 12.162, "img": "b4-evaluate", "rects": []}]}, {"block": 4, "chapter": "Step four", "title": "Choose the test set and the evaluation type", "where": "/cards/8 \u00b7 Evaluations", "audio": "play/08.mp4", "dur": 11.76, "sentences": [{"text": "Then press Run evaluation.", "start": 0.0, "end": 1.637, "img": "b4-evaluate", "rects": []}, {"text": "Despite its name, it does not start anything: it creates a draft evaluation and opens its configuration.", "start": 1.977, "end": 7.936, "img": "b4-evaluate", "rects": []}, {"text": "The completed run you will follow is already listed beneath the form.", "start": 8.276, "end": 11.759, "img": "b4-evaluate", "rects": []}]}, {"block": 5, "chapter": "Step five", "title": "Set the evaluation cohort", "where": "/evaluations/48/configure", "audio": "play/09.mp4", "dur": 14.91, "sentences": [{"text": "Because this evaluation belongs to a card, the outcome and the performance target are inherited from the card and the model.", "start": 0.0, "end": 5.638, "img": "b5-cohort", "rects": [[0.0361, 0.156, 0.6388, 0.1104]]}, {"text": "The outcome is acute kidney injury, as you mapped it, and the claim is the one you declared.", "start": 5.978, "end": 10.601, "img": "b5-cohort", "rects": []}, {"text": "What you set here is the evaluation cohort: the patients the run will score.", "start": 10.941, "end": 14.907, "img": "b5-cohort", "rects": []}]}, {"block": 5, "chapter": "Step five", "title": "Set the evaluation cohort", "where": "/evaluations/48/configure", "audio": "play/10.mp4", "dur": 24.37, "sentences": [{"text": "This run requires patients aged twenty-one and over.", "start": 0.0, "end": 3.03, "img": "b5-cohort", "rects": [[0.0561, 0.4296, 0.5989, 0.2128]]}, {"text": "That excluded one hundred and twenty-five of the sixteen thousand eight hundred and twenty-nine patients, so results are reported on sixteen thousand seven hundred and four.", "start": 3.37, "end": 12.027, "img": "b5-cohort", "rects": []}, {"text": "Notice that the card's intended population is adults, which begins at eighteen.", "start": 12.367, "end": 16.333, "img": "b5-cohort", "rects": []}, {"text": "A cohort narrower than your intended use is a choice a reviewer will ask you to justify, and it shows in the result as a smaller number of patients.", "start": 16.673, "end": 24.366, "img": "b5-cohort", "rects": []}]}, {"block": 6, "chapter": "Step six", "title": "Run it", "where": "/evaluations/48 \u00b7 Protocol", "audio": "play/11.mp4", "dur": 14.03, "sentences": [{"text": "The protocol tab summarises the run before you start it: the evaluation type, the outcome it is scored against, and the claim it will adjudicate.", "start": 0.0, "end": 7.138, "img": "b6-run", "rects": [[0.0349, 0.1105, 0.6275, 0.032], [0.0349, 0.1554, 0.6275, 0.03], [0.0349, 0.2401, 0.6275, 0.03]]}, {"text": "The data fitness check confirms that all fourteen features were found in the test set, through the concepts you mapped, for every patient.", "start": 7.478, "end": 14.029, "img": "b6-run", "rects": [[0.0349, 0.3994, 0.6275, 0.0107]]}]}, {"block": 6, "chapter": "Step six", "title": "Run it", "where": "/evaluations/48 \u00b7 Protocol", "audio": "play/12.mp4", "dur": 15.36, "sentences": [{"text": "Then press Run evaluation on this tab.", "start": 0.0, "end": 2.055, "img": "b6-run", "rects": [[0.0139, 0.9677, 0.9721, 0.0233]]}, {"text": "The node runs your image against the test set, builds the input matrix from its own records, scores every patient, and compares each score with the recorded outcome.", "start": 2.395, "end": 10.776, "img": "b6-run", "rects": []}, {"text": "The results tab opens by itself when the run finishes, typically within seconds.", "start": 11.116, "end": 15.36, "img": "b6-run", "rects": []}]}, {"block": 7, "chapter": "Step seven", "title": "Read the results", "where": "/evaluations/48 \u00b7 Results", "audio": "play/13.mp4", "dur": 20.77, "sentences": [{"text": "The run scored sixteen thousand seven hundred and four patients.", "start": 0.0, "end": 3.437, "img": "b7-results", "rects": [[0.5384, 0.0498, 0.124, 0.0311]]}, {"text": "The model reached an AUROC of zero point seven nine, with a ninety-five per cent confidence interval of zero point seven seven to zero point eight one, so the claim is met.", "start": 3.777, "end": 12.452, "img": "b7-results", "rects": [[0.0349, 0.1038, 0.088, 0.1335]]}, {"text": "That is consistent with the zero point seven eight seven you measured on this hold-out during development.", "start": 12.792, "end": 17.598, "img": "b7-results", "rects": []}, {"text": "The node has reproduced your result on data it controls.", "start": 17.938, "end": 20.771, "img": "b7-results", "rects": []}]}, {"block": 7, "chapter": "Step seven", "title": "Read the results", "where": "/evaluations/48 \u00b7 Results", "audio": "play/14.mp4", "dur": 22.84, "sentences": [{"text": "Read past the headline.", "start": 0.0, "end": 1.242, "img": "b7-results", "rects": []}, {"text": "The area under the precision-recall curve is zero point four nine, against a prevalence of nineteen per cent.", "start": 1.582, "end": 7.209, "img": "b7-results", "rects": [[0.1428, 0.1038, 0.088, 0.1335], [0.0349, 0.2599, 0.6275, 0.0233]]}, {"text": "Sensitivity is zero point two three, so at this operating point the model flags fewer than one in four patients who go on to develop the injury, while rarely raising a false alarm.", "start": 7.549, "end": 17.222, "img": "b7-results", "rects": [[0.3586, 0.1038, 0.088, 0.1335]]}, {"text": "A notified body will ask which operating point your intended use assumes, so have the answer ready.", "start": 17.562, "end": 22.84, "img": "b7-results", "rects": []}]}, {"block": 7, "chapter": "Step seven", "title": "Read the results", "where": "/evaluations/48 \u00b7 Results", "audio": "play/15.mp4", "dur": 23.91, "sentences": [{"text": "Two more things a reviewer will check.", "start": 0.0, "end": 1.718, "img": "b7-results", "rects": []}, {"text": "Every subgroup reports its size and its events, and the figure for patients under forty ties for the best while resting on the fewest events, one hundred and forty-nine.", "start": 2.058, "end": 11.407, "img": "b7-results", "rects": [[0.0349, 0.4167, 0.6275, 0.0226]]}, {"text": "And creatinine carries most of the model's reliance, so be ready to show it is not leakage.", "start": 11.747, "end": 16.584, "img": "b7-results", "rects": [[0.0349, 0.5643, 0.6275, 0.0226]]}, {"text": "Your provenance already records that the defining creatinine is measured strictly after the index time, while the feature is the value before it.", "start": 16.924, "end": 23.909, "img": "b7-results", "rects": []}]}, {"block": 8, "chapter": "Step eight", "title": "Submit for review", "where": "/cards/8 \u00b7 Conformity record", "audio": "play/16.mp4", "dur": 11.98, "sentences": [{"text": "When the results are ready and the model is certified, press Submit for review.", "start": 0.0, "end": 4.082, "img": "b7-results", "rects": [[0.0139, 0.9294, 0.1406, 0.0508]]}, {"text": "This records the evaluation on the ledger and moves the card into evaluation, where it appears in the review queue of every notified body on the node.", "start": 4.422, "end": 11.976, "img": "b8-record", "rects": [[0.0146, 0.3791, 0.9709, 0.1848]]}]}, {"block": 8, "chapter": "Step eight", "title": "Submit for review", "where": "/cards/8 \u00b7 Conformity record", "audio": "play/17.mp4", "dur": 15.69, "sentences": [{"text": "From here the record is no longer yours alone.", "start": 0.0, "end": 2.299, "img": "b8-record", "rects": []}, {"text": "The card's audit trail shows every state change and who signed it: you created and submitted the card, a notified body validated it, and a regulator published it, each with its own signing address.", "start": 2.639, "end": 13.07, "img": "b8-record", "rects": [[0.0146, 0.1991, 0.9709, 0.1801], [0.0146, 0.564, 0.9709, 0.1848], [0.0146, 0.7488, 0.9709, 0.1848]]}, {"text": "No single party can move a device to market.", "start": 13.41, "end": 15.685, "img": "b8-record", "rects": []}]}, {"block": 9, "chapter": "Closing", "title": "What the node has established", "where": "", "audio": "play/18.mp4", "dur": 9.15, "sentences": [{"text": "You have evaluated a certified model on a held-out test set without moving a single patient record.", "start": 0.0, "end": 5.294, "img": null, "rects": []}, {"text": "The node has reproduced your declared performance and adjudicated your claim.", "start": 5.634, "end": 9.152, "img": null, "rects": []}], "card": {"eyebrow": "Next", "rows": [["Established", "Your declared performance, reproduced on data the node controls"], ["Not established", "External validation, which needs another site's data"], ["Next", "A notified body reviews the evidence"]]}}, {"block": 9, "chapter": "Closing", "title": "What the node has established", "where": "", "audio": "play/19.mp4", "dur": 15.1, "sentences": [{"text": "Be precise about what that shows.", "start": 0.0, "end": 1.718, "img": null, "rects": []}, {"text": "It confirms the model performs as you said on the data you held out.", "start": 2.058, "end": 5.228, "img": null, "rects": []}, {"text": "It does not show the model generalises to another hospital, which needs an external dataset.", "start": 5.568, "end": 10.381, "img": null, "rects": []}, {"text": "The companion walkthrough shows how a notified body reads the evidence you have just submitted.", "start": 10.721, "end": 15.098, "img": null, "rects": []}], "card": {"eyebrow": "Next", "rows": [["Established", "Your declared performance, reproduced on data the node controls"], ["Not established", "External validation, which needs another site's data"], ["Next", "A notified body reviews the evidence"]]}}], "images": {"b1-datasets": {"src": "data:image/webp;base64,UklGRuBPAABXRUJQVlA4INRPAABw3gGdASrcBbgCPmEwlUikIr+hINOIi/AMCWlu+/fdTA4GxsSTBWVQgeVv2fi5QE+ljb0eYX9oPVn/6f7De6j+6eoB+unqzerf/b/+57AH7Qes9/3fZd/vX/k9Nj1AP//wRHjf+3/jv4Kf3b8mP7n6V/jPzL9s/vX7Qf2T9r/jB/yv7N42PS/5f/kf4T1K/kH1x+7f2n9xP8H+9P3Z/cv9B/d/3C/wfo78WP5r+9/t//YfkF/JP5b/f/7b+6f+F/eP3N9kzrH+j/3f+J/cz4BfW759/s/79+83+V9F7+p/unqR+j/2f/S/3z8h/sA/j/9C/1P96/Ij5e/3n69eVP98/4f/W/0nwA/zX+zf97/Gf534X/6D/yf57/Yftz7aPz7/Of+b/N/6v5CP5l/Zv+n/jf9H78///9z/7zf//3a/3a//4Qroj6yJjh/V20/q7af1cT2Hg85C/ZxcU/q7af1dtP6u2n9XbT+rtp/V20/q7af1NKbVXzlW35J6zgItJd2IWkw9ELSYeiFpMPRC0mHohaTD0QtJh6IWkw9ELSYeiFpMPRC0mHohaTD0QtJh6IWkw9ELSYeiFpMPRC0mAqyJjh/V20/q7af1dtP6u2n9XbT+rtp/V20/q7af1dtP6u2n9XbT+rtp/V20/q7af1dtP6u2n9XbT+rtp/V20/q7af1dtP6u2n9XbT+rtp/V20/q7ZvD6nOTVYkpec0hJaJnnJmNmLxL+vUFccHiOPz/iPrImOH9XbT+rtp/V20/q7af1dtP6u2n9XbT+rtp/V20/q7af1ds4WLXr9FvoV399KZKI0B10bgB0WxwgRpIkg4Q26I+siY4f1dtP6u2n9XbT+rtp/V20/q7af1dtP6u2n9XbT77W0LnjErVZE0+0hI55G6I+siY4f1dtP6u2n9XbT+rtp/V20/q7af1dtP6u2n9XbT+rtpvQTK9Kt1WN5XIE7Tu2CF8hzqBYGVKnKG28po9Nn68SEgMEpukPiFBnY2UCDyNk/ch6LjGphHrC+/twp3FJGFeiVb7PrImOH9XbT+rtp/V20/q7af1dtP6u2n9XbT+rm6Hr2/b9v2/b9v2/b9v2/bxfSC2afEkGP6DXmnqKRGsbfkiu6pMv3xrLK/KKNq6ZALqpTAYS/nqYCQmVcg12boj6yJjh/V20/q7af1dtP6u2n9XbT+rtp/V203wPGo4yHbpcDZKiz9gZalsD8TeL0oufZoxpK6JIXbCENHmx/pCtakHisjWANNWXNwFQTZIG74GbULhiUwyHZb1KOUG5et6G++Bx2q6uUncQKn44cV9+1qXzraniKJa6PY3zVWZCQMSsX7ykUtHBjuFljTIY50qHSgzHx1VUTox9ACCMNUnizFZ5xE9XV49hq4sRk+sjZMM1I3NciyHCbfdWCpaMVWZ/kXWKh1hbVSMdXBHL5LDRswmJK05In8qbXrImOH9XbT+qitPQd2pNZGLSnsjOhGtUTVHl1 <script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STEPS = DATA.steps, IMAGES = DATA.images;

  var $ = function (id) { return document.getElementById(id); };
  var shot = $("shot"), plate = $("plate"), stage = $("stage"), card = $("card");
  var caption = $("caption"), rail = $("rail");

  // cumulative offsets so the clock and rail read as one continuous run
  var offsets = [], total = 0;
  STEPS.forEach(function (s) { offsets.push(total); total += s.dur; });

  var audio = $("au");
  var REC = /[?&]record=1/.test(location.search);
  var step = 0, auto = true, curSentence = -1, curImg = null, boxes = [];
  var vLocal = 0;                       // virtual time within the step, record mode only

  function mmss(t) {
    t = Math.max(0, Math.round(t));
    var m = Math.floor(t / 60), s = t % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function buildRail() {
    STEPS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "tick";
      b.type = "button";
      b.title = s.chapter + ", step " + (i + 1);
      b.setAttribute("aria-label", b.title);
      b.appendChild(document.createElement("i"));
      b.addEventListener("click", function () { go(i, !audio.paused); });
      rail.appendChild(b);
    });
  }

  function paintRail() {
    [].forEach.call(rail.children, function (b, i) {
      b.dataset.state = i < step ? "done" : (i === step ? "now" : "todo");
    });
  }

  // Fit the shot into the stage, then zoom so the active highlights fill it.
  function layout() {
    var s = STEPS[step];
    var sent = s.sentences[Math.max(0, curSentence)] || s.sentences[0];
    var name = sent && sent.img;
    if (!name) { return; }
    var im = IMAGES[name];
    var C = stage.clientWidth, H = stage.clientHeight;
    if (!C || !H) { return; }
    var fit = Math.min(C / im.w, H / im.h);
    var dw = im.w * fit, dh = im.h * fit;
    shot.style.width = dw + "px";
    shot.style.height = dh + "px";

    var rects = (sent && sent.rects) || [];
    var k = 1, tx = (C - dw) / 2, ty = (H - dh) / 2;
    if (rects.length) {
      var x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      rects.forEach(function (r) {
        x0 = Math.min(x0, r[0]); y0 = Math.min(y0, r[1]);
        x1 = Math.max(x1, r[0] + r[2]); y1 = Math.max(y1, r[1] + r[3]);
      });
      var rw = (x1 - x0) * dw, rh = (y1 - y0) * dh;
      k = Math.min(C / rw, H / rh) * 0.82;
      k = Math.max(1, Math.min(k, 3.1));
      tx = C / 2 - k * (x0 + (x1 - x0) / 2) * dw;
      ty = H / 2 - k * (y0 + (y1 - y0) / 2) * dh;
      // never pull the image edges inside the stage
      if (k * dw > C) { tx = Math.min(0, Math.max(tx, C - k * dw)); } else { tx = (C - k * dw) / 2; }
      if (k * dh > H) { ty = Math.min(0, Math.max(ty, H - k * dh)); } else { ty = (H - k * dh) / 2; }
    }
    shot.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";

    boxes.forEach(function (b) { b.remove(); });
    boxes = rects.map(function (r) {
      var b = document.createElement("div");
      b.className = "box";
      b.style.left = (tx + k * r[0] * dw) + "px";
      b.style.top = (ty + k * r[1] * dh) + "px";
      b.style.width = (k * r[2] * dw) + "px";
      b.style.height = (k * r[3] * dh) + "px";
      plate.appendChild(b);
      return b;
    });
  }

  function paintCaption() {
    var s = STEPS[step];
    caption.innerHTML = "";
    var active = null;
    s.sentences.forEach(function (sn, i) {
      var el = document.createElement(i === curSentence ? "b" : "s");
      el.textContent = sn.text + " ";
      caption.appendChild(el);
      if (i === curSentence) { active = el; }
    });
    // a long paragraph can outgrow the caption box, so keep the spoken line in view
    if (active && caption.scrollHeight > caption.clientHeight) {
      caption.scrollTop = Math.max(
        0, active.offsetTop - caption.offsetTop
           - (caption.clientHeight - active.offsetHeight) / 2);
    }
  }

  function setSentence(i) {
    if (i === curSentence) { return; }
    curSentence = i;
    var name = (STEPS[step].sentences[Math.max(0, i)] || {}).img || null;
    if (name !== curImg) {
      curImg = name;
      if (name) { shot.src = IMAGES[name].src; }
    }
    paintCaption();
    layout();
  }

  // Card chapters (no capture) carry their own eyebrow and rows in the script, so the
  // player holds no walkthrough-specific text. The opening may ask for the runtime.
  function showCard(s) {
    var c = s.card || {};
    $("card-eyebrow").textContent = c.eyebrow || s.chapter;
    $("card-title").textContent = s.title;
    var meta = $("card-meta");
    meta.innerHTML = "";
    var rows = (c.rows || []).slice();
    if (s.block === 0) { rows.push(["Runtime", mmss(total) + " \u00b7 " + STEPS.length + " steps"]); }
    rows.forEach(function (r) {
      var dt = document.createElement("dt"); dt.textContent = r[0];
      var dd = document.createElement("dd"); dd.textContent = r[1];
      meta.appendChild(dt); meta.appendChild(dd);
    });
  }

  function go(i, play) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    var s = STEPS[step];
    $("chap").textContent = s.chapter;
    $("title").textContent = s.title;
    $("where").textContent = s.where;

    var hasImg = !!s.sentences[0].img;
    card.classList.toggle("on", !hasImg);
    plate.style.display = hasImg ? "" : "none";
    if (!hasImg) { showCard(s); }

    curSentence = -1;
    curImg = null;
    boxes.forEach(function (b) { b.remove(); });
    boxes = [];
    setSentence(0);
    paintRail();

    if (!REC) {
      audio.src = s.audio;
      audio.currentTime = 0;
      if (play) { audio.play().catch(stopped); } else { stopped(); }
      var nx = STEPS[step + 1];        // warm the next clip
      if (nx) { var a = new Audio(); a.preload = "auto"; a.src = nx.audio; }
    }
    tick();
  }

  function tick() {
    var el = offsets[step] + (REC ? vLocal : (audio.currentTime || 0));
    $("clock").textContent = mmss(el) + " / " + mmss(total);
  }

  function playing() { $("play").textContent = "Pause"; }
  function stopped() { $("play").textContent = "Play"; }

  audio.addEventListener("play", playing);
  audio.addEventListener("pause", stopped);
  audio.addEventListener("timeupdate", function () {
    var t = audio.currentTime, sents = STEPS[step].sentences, idx = 0;
    for (var i = 0; i < sents.length; i++) { if (t >= sents[i].start) { idx = i; } }
    setSentence(idx);
    tick();
  });
  audio.addEventListener("ended", function () {
    stopped();
    if (!auto) { return; }
    if (step < STEPS.length - 1) { go(step + 1, true); } else { paintRail(); }
  });

  $("play").addEventListener("click", function () {
    if (audio.paused) { audio.play().catch(stopped); } else { audio.pause(); }
  });
  $("prev").addEventListener("click", function () { go(step - 1, !audio.paused); });
  $("next").addEventListener("click", function () { go(step + 1, !audio.paused); });
  $("auto").addEventListener("click", function () {
    auto = !auto;
    $("auto").setAttribute("aria-pressed", String(auto));
    $("auto").textContent = auto ? "Auto-advance" : "Step by step";
  });

  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { return; }
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); go(step + 1, !audio.paused); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(step - 1, !audio.paused); }
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen().catch(function () {}); }
    }
  });

  var t = null;
  window.addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(layout, 90);
  });

  function record() {
    document.body.classList.add("rec");
    var t0 = null;
    function frame(now) {
      if (t0 === null) { t0 = now; }
      var t = (now - t0) / 1000;
      if (t >= total) {
        vLocal = STEPS[STEPS.length - 1].dur;
        tick();
        document.title = "done";      // the recorder waits for this
        return;
      }
      var i = 0;
      for (var k = 0; k < STEPS.length; k++) { if (t >= offsets[k]) { i = k; } }
      if (i !== step) { go(i, false); }
      vLocal = t - offsets[i];
      var sents = STEPS[i].sentences, idx = 0;
      for (var j = 0; j < sents.length; j++) { if (vLocal >= sents[j].start) { idx = j; } }
      setSentence(idx);
      tick();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  buildRail();
  go(0, false);
  if (REC) { setTimeout(record, 1200); }   // let fonts and the first image settle
})();
</script>
