<title>Bringing Your Device to REALM</title>

<style>
  :root {
    --stage: #EEF3F5;
    --panel: #FFFFFF;
    --ink: #101A20;
    --muted: #5B6B75;
    --faint: #8B9CA5;
    --line: #DAE3E7;
    --rule: #C2D0D6;
    --accent: #0C6B70;
    --accent-ink: #075257;
    --accent-wash: #E4F0F0;
    --mark: #C0561B;
    --mark-glow: rgba(192, 86, 27, .18);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #0A1114;
      --panel: #131E23;
      --ink: #EAF1F3;
      --muted: #93A6AE;
      --faint: #6E828B;
      --line: #1E2C33;
      --rule: #2A3C44;
      --accent: #5CBABE;
      --accent-ink: #92D6D9;
      --accent-wash: #0F2729;
      --mark: #E8863F;
      --mark-glow: rgba(232, 134, 63, .20);
    }
  }
  :root[data-theme="dark"] {
    --stage: #0A1114;
    --panel: #131E23;
    --ink: #EAF1F3;
    --muted: #93A6AE;
    --faint: #6E828B;
    --line: #1E2C33;
    --rule: #2A3C44;
    --accent: #5CBABE;
    --accent-ink: #92D6D9;
    --accent-wash: #0F2729;
    --mark: #E8863F;
    --mark-glow: rgba(232, 134, 63, .20);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--stage); color: var(--ink);
    font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app {
    height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: 0;
  }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    padding: 14px 24px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  .chap {
    font: 500 10.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
    color: var(--accent); white-space: nowrap;
  }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(17px, 2.3vw, 24px);
    letter-spacing: -.015em; margin: 0; line-height: 1.2; flex: 1 1 260px; min-width: 0;
  }
  .where { font: 400 12px/1 var(--mono); color: var(--faint); white-space: nowrap; }

  /* ── Stage ────────────────────────────────────────────────── */
  #stage { position: relative; overflow: hidden; margin: 18px 24px 0; }
  #plate {
    position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
    background: #FFFFFF; border: 1px solid var(--line);
  }
  #shot {
    position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform;
    transition: transform .62s cubic-bezier(.22,.61,.36,1);
  }
  .box {
    position: absolute; border: 2px solid var(--mark); border-radius: 4px;
    box-shadow: 0 0 0 3px var(--mark-glow), 0 0 0 9999px rgba(8, 17, 20, .40);
    transition: opacity .3s ease; pointer-events: none;
  }
  /* A title card replaces the plate on the opening and closing steps. */
  #card {
    position: absolute; inset: 0; display: none; place-content: center;
    padding: 6vh 8vw; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px;
  }
  #card.on { display: grid; }
  #card p.eyebrow {
    font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 18px;
  }
  #card h2 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(26px, 4.4vw, 46px);
    line-height: 1.12; letter-spacing: -.022em; margin: 0 0 20px; text-wrap: balance;
  }
  #card dl {
    display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0;
    font-size: 14px; max-width: 46ch;
  }
  #card dt {
    font: 500 10.5px/1.6 var(--sans); letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent);
  }
  #card dd { margin: 0; color: var(--muted); }

  /* ── Caption ──────────────────────────────────────────────── */
  #caption {
    margin: 16px 24px 0; padding: 16px 20px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: clamp(15px, 1.6vw, 20px); line-height: 1.55;
    max-height: 26vh; overflow-y: auto;
  }
  #caption s { color: var(--faint); opacity: .55; text-decoration: none; }
  #caption b { color: var(--ink); font-weight: 500; }

  /* ── Transport ────────────────────────────────────────────── */
  footer { padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn {
    font: 500 13px/1 var(--sans); color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #FFFFFF; }
  .btn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:hover { border-color: var(--rule); color: var(--ink); }
  .clock {
    font: 400 12.5px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    white-space: nowrap;
  }
  .rail { display: flex; gap: 3px; flex: 1 1 220px; min-width: 140px; }
  .tick {
    flex: 1 1 0; height: 20px; padding: 0; border: 0; background: transparent; cursor: pointer;
  }
  .tick i {
    display: block; height: 4px; border-radius: 2px; background: var(--rule);
    transition: background .2s ease;
  }
  .tick[data-state="done"] i { background: var(--accent); }
  .tick[data-state="now"] i { background: var(--mark); height: 6px; margin-top: -1px; }
  .tick:hover i { background: var(--accent-ink); }
  .hint { font: 400 11.5px/1.5 var(--sans); color: var(--faint); white-space: nowrap; }

  @media (max-width: 720px) {
    header { padding: 10px 14px 9px; }
    #stage { margin: 12px 14px 0; }
    #caption { margin: 12px 14px 0; padding: 12px 14px; max-height: 30vh; }
    footer { padding: 10px 14px; gap: 8px; }
    .hint { display: none; }
  }
  /* ?record=1 drives the timeline from a clock and hides the controls, so a headless
     capture does not depend on audio autoplay. */
  body.rec footer, body.rec .hint { display: none; }
  body.rec #caption { max-height: 30vh; }
  @media (prefers-reduced-motion: reduce) {
    #shot { transition: none; }
    .box { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="chap" id="chap"></span>
    <h1 id="title"></h1>
    <span class="where" id="where"></span>

  <div id="stage">
    <div id="plate"><img id="shot" alt=""></div>

      <div>
        <p class="eyebrow" id="card-eyebrow"></p>
        <h2 id="card-title"></h2>
        <dl id="card-meta"></dl>
      </div>
    </div>
  </div>

  <div id="caption" aria-live="polite"></div>

  <footer>
    <button class="btn primary" id="play">Play</button>
    <button class="btn" id="prev" aria-label="Previous step">Back</button>
    <button class="btn" id="next" aria-label="Next step">Next</button>
    <button class="btn" id="auto" aria-pressed="true">Auto-advance</button>
    <span class="clock" id="clock">0:00 / 0:00</span>
    <div class="rail" id="rail" role="group" aria-label="Steps"></div>
    <span class="hint">Space, arrows, F for fullscreen</span>
  </footer>
  <audio id="au" preload="auto" hidden></audio>
</div>

<script type="application/json" id="data">{"model": "en_US-hfc_male-medium", "title": "Bringing Your Device to REALM", "total": 404.5, "steps": [{"block": 0, "chapter": "Opening", "title": "Bringing your device onto a REALM node", "where": "", "audio": "play/00.mp4", "dur": 19.74, "sentences": [{"text": "This walkthrough takes a medical device from your own machine to a certified model on a REALM node.", "start": 0.0, "end": 4.667, "img": null, "rects": []}, {"text": "The device is AKI-Onset, which predicts acute kidney injury within forty-eight hours of a twenty-four hour intensive care index.", "start": 5.007, "end": 12.568, "img": null, "rects": []}, {"text": "It is the same device a notified body assesses in the companion walkthrough, so what you build here is exactly what they will later examine.", "start": 12.908, "end": 19.742, "img": null, "rects": []}], "card": {"eyebrow": "REALM-OS \u00b7 manufacturer walkthrough one", "rows": [["Device", "AKI-Onset (ICU, 24h index) v0.1.0"], ["You need", "Docker, cosign, a container registry, an approved organisation"], ["You end with", "A certified model, ready to evaluate"]]}}, {"block": 0, "chapter": "Opening", "title": "Bringing your device onto a REALM node", "where": "", "audio": "play/01.mp4", "dur": 16.31, "sentences": [{"text": "A REALM node never receives your training data, and it does not rely on a description of your model.", "start": 0.0, "end": 4.883, "img": null, "rects": []}, {"text": "It receives a container image, runs it in isolation against its own data, and returns only aggregate results.", "start": 5.223, "end": 11.124, "img": null, "rects": []}, {"text": "Everything here is about producing an image the node can identify, verify and run.", "start": 11.464, "end": 16.312, "img": null, "rects": []}], "card": {"eyebrow": "REALM-OS \u00b7 manufacturer walkthrough one", "rows": [["Device", "AKI-Onset (ICU, 24h index) v0.1.0"], ["You need", "Docker, cosign, a container registry, an approved organisation"], ["You end with", "A certified model, ready to evaluate"]]}}, {"block": 1, "chapter": "Step one", "title": "Serve the contract", "where": "model/server.py", "audio": "play/02.mp4", "dur": 11.62, "sentences": [{"text": "Your image must answer three requests on port eighty eighty, following the Open Inference Protocol: a readiness check, a metadata description, and an inference call.", "start": 0.0, "end": 8.643, "img": "a1-server", "rects": []}, {"text": "The readiness check simply reports when the model is loaded.", "start": 8.983, "end": 11.619, "img": "a1-server", "rects": [[0.0139, 0.6563, 0.9722, 0.0161]]}]}, {"block": 1, "chapter": "Step one", "title": "Serve the contract", "where": "model/server.py", "audio": "play/03.mp4", "dur": 17.54, "sentences": [{"text": "The metadata call is where you declare your inputs, and its most important field is the ordered list of feature names.", "start": 0.0, "end": 5.708, "img": "a1-server", "rects": [[0.0139, 0.3032, 0.9722, 0.0161]]}, {"text": "The node builds its input matrix from patient records in exactly that column order, and nothing checks that the order is right.", "start": 6.048, "end": 11.941, "img": "a1-server", "rects": [[0.0139, 0.8008, 0.9722, 0.0161]]}, {"text": "If your list disagrees with the order your model was trained on, it will score nonsense without raising an error.", "start": 12.281, "end": 17.536, "img": "a1-server", "rects": []}]}, {"block": 1, "chapter": "Step one", "title": "Serve the contract", "where": "model/server.py", "audio": "play/04.mp4", "dur": 17.95, "sentences": [{"text": "The inference call receives that matrix and returns one probability per row, between zero and one.", "start": 0.0, "end": 5.441, "img": "a1-server", "rects": [[0.0139, 0.865, 0.9722, 0.0161]]}, {"text": "Notice that this server repeats its training preprocessing, clipping each laboratory value to a clinical range before scoring.", "start": 5.781, "end": 12.045, "img": "a1-server", "rects": [[0.0139, 0.9131, 0.9722, 0.0161]]}, {"text": "Serving has to reproduce training exactly, or the numbers the node reports will not be the numbers you validated.", "start": 12.385, "end": 17.954, "img": "a1-server", "rects": []}]}, {"block": 2, "chapter": "Step two", "title": "Package it without the data", "where": "model/Dockerfile", "audio": "play/05.mp4", "dur": 13.57, "sentences": [{"text": "This model was trained on MIMIC-IV, a credentialed clinical database whose data use agreement forbids redistributing it.", "start": 0.0, "end": 6.184, "img": "a2-dockerfile", "rects": []}, {"text": "So the training data must never enter the image.", "start": 6.524, "end": 8.73, "img": "a2-dockerfile", "rects": [[0.0139, 0.2641, 0.9722, 0.0448]]}, {"text": "Training happens on your own machine, and the fitted weights are the only output you carry forward.", "start": 9.07, "end": 13.57, "img": "a2-dockerfile", "rects": [[0.0139, 0.4434, 0.9722, 0.0448]]}]}, {"block": 2, "chapter": "Step two", "title": "Package it without the data", "where": "model/Dockerfile", "audio": "play/06.mp4", "dur": 16.43, "sentences": [{"text": "The image therefore contains the server, the trained weights and their dependencies, and nothing else.", "start": 0.0, "end": 5.192, "img": "a2-dockerfile", "rects": [[0.0139, 0.7573, 0.9722, 0.0448]]}, {"text": "Two details matter.", "start": 5.532, "end": 6.717, "img": "a2-dockerfile", "rects": []}, {"text": "The training environment must match the image's package versions exactly, or the saved weights will fail to load.", "start": 7.057, "end": 12.358, "img": "a2-dockerfile", "rects": []}, {"text": "And the image must listen on port eighty eighty, which is where the node will call it.", "start": 12.698, "end": 16.432, "img": "a2-dockerfile", "rects": [[0.0139, 0.847, 0.9722, 0.0448]]}]}, {"block": 3, "chapter": "Step three", "title": "Test it the way the node will", "where": "your terminal", "audio": "play/07.mp4", "dur": 14.25, "sentences": [{"text": "Before you send the image anywhere, run it and call all three endpoints exactly as the node will.", "start": 0.0, "end": 5.208, "img": "a3-test", "rects": []}, {"text": "The readiness check answers true.", "start": 5.548, "end": 7.267, "img": "a3-test", "rects": [[0.0139, 0.2716, 0.9722, 0.051]]}, {"text": "The metadata confirms fourteen features, each a sixty-four bit number.", "start": 7.607, "end": 11.422, "img": "a3-test", "rects": [[0.0139, 0.447, 0.9722, 0.051]]}, {"text": "It also lists them in the order the node must follow.", "start": 11.762, "end": 14.246, "img": "a3-test", "rects": [[0.0139, 0.4979, 0.9722, 0.051]]}]}, {"block": 3, "chapter": "Step three", "title": "Test it the way the node will", "where": "your terminal", "audio": "play/08.mp4", "dur": 20.96, "sentences": [{"text": "Then send real values.", "start": 0.0, "end": 1.544, "img": "a3-test", "rects": []}, {"text": "Here two intensive care patients are scored: one with normal laboratory values receives a risk of six per cent, and one with raised creatinine, urea and lactate receives seventy-five per cent.", "start": 1.884, "end": 12.111, "img": "a3-test", "rects": [[0.0139, 0.8771, 0.9722, 0.051]]}, {"text": "This is the check that matters most at this stage, because a model that returns sensible numbers for clinically obvious cases is far less likely to have its feature order wrong.", "start": 12.451, "end": 20.956, "img": "a3-test", "rects": []}]}, {"block": 4, "chapter": "Step four", "title": "Pre-flight the certification gates", "where": "your terminal", "audio": "play/09.mp4", "dur": 16.06, "sentences": [{"text": "The node certifies your image through five gates, and you can check the two that most often fail before you submit.", "start": 0.0, "end": 5.394, "img": "a4-preflight", "rects": []}, {"text": "The first is determinism.", "start": 5.734, "end": 7.162, "img": "a4-preflight", "rects": []}, {"text": "Score the same patients three times, then restart the container and score them again.", "start": 7.502, "end": 11.735, "img": "a4-preflight", "rects": []}, {"text": "Every result here is identical to the last digit, including after the restart.", "start": 12.075, "end": 16.065, "img": "a4-preflight", "rects": [[0.0139, 0.501, 0.9722, 0.0564]]}]}, {"block": 4, "chapter": "Step four", "title": "Pre-flight the certification gates", "where": "your terminal", "audio": "play/10.mp4", "dur": 14.56, "sentences": [{"text": "The restart is the part that catches real problems.", "start": 0.0, "end": 2.554, "img": "a4-preflight", "rects": []}, {"text": "A model can be reproducible within one running process and still change its answers after a restart, through an unpinned random seed or a non-deterministic library.", "start": 2.894, "end": 11.423, "img": "a4-preflight", "rects": []}, {"text": "The node tests across a restart for exactly that reason.", "start": 11.763, "end": 14.561, "img": "a4-preflight", "rects": []}]}, {"block": 4, "chapter": "Step four", "title": "Pre-flight the certification gates", "where": "your terminal", "audio": "play/11.mp4", "dur": 16.72, "sentences": [{"text": "The second is hermetic execution.", "start": 0.0, "end": 1.95, "img": "a4-preflight", "rects": []}, {"text": "Start the container with its network removed.", "start": 2.29, "end": 4.369, "img": "a4-preflight", "rects": []}, {"text": "It still becomes ready, and an attempt to reach the internet fails.", "start": 4.709, "end": 8.21, "img": "a4-preflight", "rects": [[0.0139, 0.7513, 0.9722, 0.0564], [0.0139, 0.8641, 0.9722, 0.0564]]}, {"text": "On a compute-to-data node your model must never call out, whether to fetch weights, check a licence or send telemetry, and the node certifies with the network switched off.", "start": 8.55, "end": 16.722, "img": "a4-preflight", "rects": []}]}, {"block": 5, "chapter": "Step five", "title": "Push and sign", "where": "your terminal", "audio": "play/12.mp4", "dur": 14.15, "sentences": [{"text": "Push the image to a registry the node can pull from.", "start": 0.0, "end": 2.635, "img": "a5-sign", "rects": [[0.0139, 0.1836, 0.9722, 0.0472]]}, {"text": "For a model trained on credentialed data, keep the registry private and grant the node read access.", "start": 2.975, "end": 7.847, "img": "a5-sign", "rects": []}, {"text": "On GitHub's container registry that means setting the package visibility to internal, or the node's pull will fail.", "start": 8.187, "end": 14.15, "img": "a5-sign", "rects": []}]}, {"block": 5, "chapter": "Step five", "title": "Push and sign", "where": "your terminal", "audio": "play/13.mp4", "dur": 10.93, "sentences": [{"text": "Then sign it.", "start": 0.0, "end": 0.778, "img": "a5-sign", "rects": []}, {"text": "Cosign attaches a signed provenance attestation to the image, recording who built it and from what.", "start": 1.118, "end": 5.781, "img": "a5-sign", "rects": [[0.0139, 0.2308, 0.9722, 0.0472]]}, {"text": "The attestation is bound to the image's digest, so any change to the image breaks the signature.", "start": 6.121, "end": 10.934, "img": "a5-sign", "rects": []}]}, {"block": 5, "chapter": "Step five", "title": "Push and sign", "where": "your terminal", "audio": "play/14.mp4", "dur": 20.6, "sentences": [{"text": "You can see what was attached to the published AKI-Onset image: an attestation and a signature, both tied to its digest.", "start": 0.0, "end": 7.127, "img": "a5-sign", "rects": [[0.0139, 0.4405, 0.9722, 0.0472]]}, {"text": "Inside, the provenance names the source repository as the builder.", "start": 7.467, "end": 11.026, "img": "a5-sign", "rects": [[0.0139, 0.7917, 0.9722, 0.0472]]}, {"text": "It also declares the build as not reproducible, which is correct for a model trained outside the image.", "start": 11.366, "end": 16.528, "img": "a5-sign", "rects": [[0.0139, 0.8862, 0.9722, 0.0472]]}, {"text": "Whatever you write in that provenance is what an assessor will later read on the certificate.", "start": 16.868, "end": 20.595, "img": "a5-sign", "rects": []}]}, {"block": 6, "chapter": "Step six", "title": "Enrol your signing key", "where": "Studio \u00b7 your organisation", "audio": "play/15.mp4", "dur": 12.53, "sentences": [{"text": "The node verifies your signature against public keys enrolled by your organisation, not against a single key for the whole node.", "start": 0.0, "end": 6.451, "img": "a6-keys", "rects": []}, {"text": "A manager of your organisation enrols the public half of your signing key here, and it is active immediately.", "start": 6.791, "end": 12.533, "img": "a6-keys", "rects": [[0.05, 0.2185, 0.9, 0.1171]]}]}, {"block": 6, "chapter": "Step six", "title": "Enrol your signing key", "where": "Studio \u00b7 your organisation", "audio": "play/16.mp4", "dur": 17.77, "sentences": [{"text": "Two conditions follow.", "start": 0.0, "end": 1.045, "img": "a6-keys", "rects": []}, {"text": "Your organisation must be approved on the node, and you must be an active member acting for it when you import, because the node checks the signature against the keys of the organisation you are acting for.", "start": 1.385, "end": 11.244, "img": "a6-keys", "rects": [[0.05, 0.2815, 0.7303, 0.036]]}, {"text": "This screen comes from a local instance of Studio with an example key, because only an organisation's managers can see it.", "start": 11.584, "end": 17.768, "img": "a6-keys", "rects": []}]}, {"block": 7, "chapter": "Step seven", "title": "Import and certify", "where": "/models/import", "audio": "play/17.mp4", "dur": 18.34, "sentences": [{"text": "In Studio, open Models and choose Import a model.", "start": 0.0, "end": 2.91, "img": "a7-import", "rects": []}, {"text": "Give it a name, a version, and the image reference you pushed.", "start": 3.25, "end": 6.689, "img": "a7-import", "rects": [[0.0232, 0.216, 0.9536, 0.0788]]}, {"text": "If your registry is private, add the pull credentials here; they are used only to authenticate the pull and are never stored.", "start": 7.029, "end": 13.161, "img": "a7-import", "rects": [[0.0232, 0.5781, 0.9536, 0.0254]]}, {"text": "You can also import a saved image as a file, which suits a node with no route to your registry.", "start": 13.501, "end": 18.338, "img": "a7-import", "rects": [[0.0232, 0.4142, 0.9536, 0.0864]]}]}, {"block": 7, "chapter": "Step seven", "title": "Import and certify", "where": "/models/import", "audio": "play/18.mp4", "dur": 16.08, "sentences": [{"text": "Import and certify pulls the image and hands it to the node's model factory.", "start": 0.0, "end": 3.75, "img": "a7-import", "rects": []}, {"text": "Import succeeds as soon as the image is pulled and inspected, even if a gate fails, so that you can see exactly which one did.", "start": 4.09, "end": 10.826, "img": "a7-import", "rects": []}, {"text": "An unsigned image, for example, imports with every gate green except the attestation.", "start": 11.166, "end": 16.08, "img": "a7-import", "rects": []}]}, {"block": 8, "chapter": "Step eight", "title": "Read the certificate", "where": "/models/4", "audio": "play/19.mp4", "dur": 16.9, "sentences": [{"text": "The certificate reports each gate separately.", "start": 0.0, "end": 2.403, "img": "a8-cert", "rects": []}, {"text": "Conformance confirms the metadata matches the declared contract and that one score comes back per row.", "start": 2.743, "end": 8.212, "img": "a8-cert", "rects": [[0.044, 0.3144, 0.9121, 0.0976]]}, {"text": "Behaviour confirms the outputs are finite, in range, and vary with the input, so a stuck model that returns the same score for everyone fails here.", "start": 8.552, "end": 16.897, "img": "a8-cert", "rects": [[0.044, 0.4194, 0.9121, 0.0976]]}]}, {"block": 8, "chapter": "Step eight", "title": "Read the certificate", "where": "/models/4", "audio": "play/20.mp4", "dur": 15.41, "sentences": [{"text": "Determinism and hermetic execution repeat the checks you ran yourself, now under the node's control: five runs and a restart, then serving with the network off.", "start": 0.0, "end": 8.624, "img": "a8-cert", "rects": [[0.044, 0.5219, 0.9121, 0.0976], [0.044, 0.6245, 0.9121, 0.0754]]}, {"text": "The vendor attestation confirms the signature verified against your enrolled key.", "start": 8.964, "end": 12.761, "img": "a8-cert", "rects": [[0.044, 0.8073, 0.9121, 0.1198]]}, {"text": "It also prints the builder from your provenance.", "start": 13.101, "end": 15.411, "img": "a8-cert", "rects": [[0.0641, 0.8851, 0.892, 0.0198]]}]}, {"block": 8, "chapter": "Step eight", "title": "Read the certificate", "where": "/models/4", "audio": "play/21.mp4", "dur": 13.09, "sentences": [{"text": "The software bill of materials is listed alongside the gates, but it is recorded for information only and never blocks certification.", "start": 0.0, "end": 6.95, "img": "a8-cert", "rects": [[0.044, 0.937, 0.9121, 0.0198]]}, {"text": "When every gate passes, the verdict reads certified, and the model can be bound to a card and evaluated.", "start": 7.29, "end": 13.086, "img": "a8-cert", "rects": [[0.044, 0.0877, 0.2839, 0.0556]]}]}, {"block": 9, "chapter": "Step nine", "title": "Map each feature to a concept", "where": "/models/4", "audio": "play/22.mp4", "dur": 15.35, "sentences": [{"text": "The last step tells the node what each of your features means.", "start": 0.0, "end": 2.694, "img": "a9-map", "rects": []}, {"text": "For every feature name, choose its domain and search for the standard concept it corresponds to.", "start": 3.034, "end": 7.905, "img": "a9-map", "rects": []}, {"text": "Creatinine, for example, maps to the standard laboratory concept for serum creatinine, and lactate to serum lactate.", "start": 8.245, "end": 15.349, "img": "a9-map", "rects": [[0.4472, 0.1825, 0.5138, 0.0214], [0.4472, 0.7842, 0.5138, 0.0214]]}]}, {"block": 9, "chapter": "Step nine", "title": "Map each feature to a concept", "where": "/models/4", "audio": "play/23.mp4", "dur": 17.13, "sentences": [{"text": "Then name the outcome the model predicts, here acute kidney injury.", "start": 0.0, "end": 3.281, "img": "a9-map", "rects": [[0.4472, 0.9004, 0.5138, 0.0214]]}, {"text": "This mapping is what lets the node build your input matrix from its own patient records, so it carries the same risk as feature order: a wrong concept produces wrong inputs without any error.", "start": 3.621, "end": 13.69, "img": "a9-map", "rects": []}, {"text": "Check each one against your training definitions before you save.", "start": 14.03, "end": 17.129, "img": "a9-map", "rects": []}]}, {"block": 10, "chapter": "Closing", "title": "A certified model, ready to evaluate", "where": "", "audio": "play/24.mp4", "dur": 11.8, "sentences": [{"text": "You now have a certified model on the node: an image it can identify by digest, has verified against your organisation's key, and has shown to be deterministic and hermetic, with every input mapped to a standard concept.", "start": 0.0, "end": 11.801, "img": null, "rects": []}], "card": {"eyebrow": "Next", "rows": [["Done", "Served, tested, signed, pushed, certified and mapped"], ["Next", "Evaluate it on your held-out test set, in walkthrough two"], ["Kept private", "Your training data never left your machine"]]}}, {"block": 10, "chapter": "Closing", "title": "A certified model, ready to evaluate", "where": "", "audio": "play/25.mp4", "dur": 8.67, "sentences": [{"text": "Notice what the node never received: your training data.", "start": 0.0, "end": 2.852, "img": null, "rects": []}, {"text": "The next walkthrough evaluates this model on a held-out test set, using the labelled outcome evaluation type.", "start": 3.192, "end": 8.667, "img": null, "rects": []}], "card": {"eyebrow": "Next", "rows": [["Done", "Served, tested, signed, pushed, certified and mapped"], ["Next", "Evaluate it on your held-out test set, in walkthrough two"], ["Kept private", "Your training data never left your machine"]]}}], "images": {"a1-server": {"src": "data:image/webp;base64,UklGRsp1AgBXRUJQVlA4IL51AgAw8QidASrcBTUIPmEulEekIiShIlO5+JAMCWlu/D2FK/hp80O+pWKvzd4jqPvkw6xhtXHH+j10q3fjxIEtnx+0zn0L/+rY4NO8msO9PHSlkc0B+GLfG+YD <script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STEPS = DATA.steps, IMAGES = DATA.images;

  var $ = function (id) { return document.getElementById(id); };
  var shot = $("shot"), plate = $("plate"), stage = $("stage"), card = $("card");
  var caption = $("caption"), rail = $("rail");

  // cumulative offsets so the clock and rail read as one continuous run
  var offsets = [], total = 0;
  STEPS.forEach(function (s) { offsets.push(total); total += s.dur; });

  var audio = $("au");
  var REC = /[?&]record=1/.test(location.search);
  var step = 0, auto = true, curSentence = -1, curImg = null, boxes = [];
  var vLocal = 0;                       // virtual time within the step, record mode only

  function mmss(t) {
    t = Math.max(0, Math.round(t));
    var m = Math.floor(t / 60), s = t % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function buildRail() {
    STEPS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "tick";
      b.type = "button";
      b.title = s.chapter + ", step " + (i + 1);
      b.setAttribute("aria-label", b.title);
      b.appendChild(document.createElement("i"));
      b.addEventListener("click", function () { go(i, !audio.paused); });
      rail.appendChild(b);
    });
  }

  function paintRail() {
    [].forEach.call(rail.children, function (b, i) {
      b.dataset.state = i < step ? "done" : (i === step ? "now" : "todo");
    });
  }

  // Fit the shot into the stage, then zoom so the active highlights fill it.
  function layout() {
    var s = STEPS[step];
    var sent = s.sentences[Math.max(0, curSentence)] || s.sentences[0];
    var name = sent && sent.img;
    if (!name) { return; }
    var im = IMAGES[name];
    var C = stage.clientWidth, H = stage.clientHeight;
    if (!C || !H) { return; }
    var fit = Math.min(C / im.w, H / im.h);
    var dw = im.w * fit, dh = im.h * fit;
    shot.style.width = dw + "px";
    shot.style.height = dh + "px";

    var rects = (sent && sent.rects) || [];
    var k = 1, tx = (C - dw) / 2, ty = (H - dh) / 2;
    if (rects.length) {
      var x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      rects.forEach(function (r) {
        x0 = Math.min(x0, r[0]); y0 = Math.min(y0, r[1]);
        x1 = Math.max(x1, r[0] + r[2]); y1 = Math.max(y1, r[1] + r[3]);
      });
      var rw = (x1 - x0) * dw, rh = (y1 - y0) * dh;
      k = Math.min(C / rw, H / rh) * 0.82;
      k = Math.max(1, Math.min(k, 3.1));
      tx = C / 2 - k * (x0 + (x1 - x0) / 2) * dw;
      ty = H / 2 - k * (y0 + (y1 - y0) / 2) * dh;
      // never pull the image edges inside the stage
      if (k * dw > C) { tx = Math.min(0, Math.max(tx, C - k * dw)); } else { tx = (C - k * dw) / 2; }
      if (k * dh > H) { ty = Math.min(0, Math.max(ty, H - k * dh)); } else { ty = (H - k * dh) / 2; }
    }
    shot.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";

    boxes.forEach(function (b) { b.remove(); });
    boxes = rects.map(function (r) {
      var b = document.createElement("div");
      b.className = "box";
      b.style.left = (tx + k * r[0] * dw) + "px";
      b.style.top = (ty + k * r[1] * dh) + "px";
      b.style.width = (k * r[2] * dw) + "px";
      b.style.height = (k * r[3] * dh) + "px";
      plate.appendChild(b);
      return b;
    });
  }

  function paintCaption() {
    var s = STEPS[step];
    caption.innerHTML = "";
    var active = null;
    s.sentences.forEach(function (sn, i) {
      var el = document.createElement(i === curSentence ? "b" : "s");
      el.textContent = sn.text + " ";
      caption.appendChild(el);
      if (i === curSentence) { active = el; }
    });
    // a long paragraph can outgrow the caption box, so keep the spoken line in view
    if (active && caption.scrollHeight > caption.clientHeight) {
      caption.scrollTop = Math.max(
        0, active.offsetTop - caption.offsetTop
           - (caption.clientHeight - active.offsetHeight) / 2);
    }
  }

  function setSentence(i) {
    if (i === curSentence) { return; }
    curSentence = i;
    var name = (STEPS[step].sentences[Math.max(0, i)] || {}).img || null;
    if (name !== curImg) {
      curImg = name;
      if (name) { shot.src = IMAGES[name].src; }
    }
    paintCaption();
    layout();
  }

  // Card chapters (no capture) carry their own eyebrow and rows in the script, so the
  // player holds no walkthrough-specific text. The opening may ask for the runtime.
  function showCard(s) {
    var c = s.card || {};
    $("card-eyebrow").textContent = c.eyebrow || s.chapter;
    $("card-title").textContent = s.title;
    var meta = $("card-meta");
    meta.innerHTML = "";
    var rows = (c.rows || []).slice();
    if (s.block === 0) { rows.push(["Runtime", mmss(total) + " \u00b7 " + STEPS.length + " steps"]); }
    rows.forEach(function (r) {
      var dt = document.createElement("dt"); dt.textContent = r[0];
      var dd = document.createElement("dd"); dd.textContent = r[1];
      meta.appendChild(dt); meta.appendChild(dd);
    });
  }

  function go(i, play) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    var s = STEPS[step];
    $("chap").textContent = s.chapter;
    $("title").textContent = s.title;
    $("where").textContent = s.where;

    var hasImg = !!s.sentences[0].img;
    card.classList.toggle("on", !hasImg);
    plate.style.display = hasImg ? "" : "none";
    if (!hasImg) { showCard(s); }

    curSentence = -1;
    curImg = null;
    boxes.forEach(function (b) { b.remove(); });
    boxes = [];
    setSentence(0);
    paintRail();

    if (!REC) {
      audio.src = s.audio;
      audio.currentTime = 0;
      if (play) { audio.play().catch(stopped); } else { stopped(); }
      var nx = STEPS[step + 1];        // warm the next clip
      if (nx) { var a = new Audio(); a.preload = "auto"; a.src = nx.audio; }
    }
    tick();
  }

  function tick() {
    var el = offsets[step] + (REC ? vLocal : (audio.currentTime || 0));
    $("clock").textContent = mmss(el) + " / " + mmss(total);
  }

  function playing() { $("play").textContent = "Pause"; }
  function stopped() { $("play").textContent = "Play"; }

  audio.addEventListener("play", playing);
  audio.addEventListener("pause", stopped);
  audio.addEventListener("timeupdate", function () {
    var t = audio.currentTime, sents = STEPS[step].sentences, idx = 0;
    for (var i = 0; i < sents.length; i++) { if (t >= sents[i].start) { idx = i; } }
    setSentence(idx);
    tick();
  });
  audio.addEventListener("ended", function () {
    stopped();
    if (!auto) { return; }
    if (step < STEPS.length - 1) { go(step + 1, true); } else { paintRail(); }
  });

  $("play").addEventListener("click", function () {
    if (audio.paused) { audio.play().catch(stopped); } else { audio.pause(); }
  });
  $("prev").addEventListener("click", function () { go(step - 1, !audio.paused); });
  $("next").addEventListener("click", function () { go(step + 1, !audio.paused); });
  $("auto").addEventListener("click", function () {
    auto = !auto;
    $("auto").setAttribute("aria-pressed", String(auto));
    $("auto").textContent = auto ? "Auto-advance" : "Step by step";
  });

  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { return; }
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); go(step + 1, !audio.paused); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(step - 1, !audio.paused); }
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen().catch(function () {}); }
    }
  });

  var t = null;
  window.addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(layout, 90);
  });

  function record() {
    document.body.classList.add("rec");
    var t0 = null;
    function frame(now) {
      if (t0 === null) { t0 = now; }
      var t = (now - t0) / 1000;
      if (t >= total) {
        vLocal = STEPS[STEPS.length - 1].dur;
        tick();
        document.title = "done";      // the recorder waits for this
        return;
      }
      var i = 0;
      for (var k = 0; k < STEPS.length; k++) { if (t >= offsets[k]) { i = k; } }
      if (i !== step) { go(i, false); }
      vLocal = t - offsets[i];
      var sents = STEPS[i].sentences, idx = 0;
      for (var j = 0; j < sents.length; j++) { if (vLocal >= sents[j].start) { idx = j; } }
      setSentence(idx);
      tick();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  buildRail();
  go(0, false);
  if (REC) { setTimeout(record, 1200); }   // let fonts and the first image settle
})();
</script>
