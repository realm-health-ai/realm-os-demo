<style>
  :root {
    --stage: #EEF3F5;
    --panel: #FFFFFF;
    --ink: #101A20;
    --muted: #5B6B75;
    --faint: #8B9CA5;
    --line: #DAE3E7;
    --rule: #C2D0D6;
    --accent: #0C6B70;
    --accent-ink: #075257;
    --accent-wash: #E4F0F0;
    --mark: #C0561B;
    --mark-glow: rgba(192, 86, 27, .18);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #0A1114;
      --panel: #131E23;
      --ink: #EAF1F3;
      --muted: #93A6AE;
      --faint: #6E828B;
      --line: #1E2C33;
      --rule: #2A3C44;
      --accent: #5CBABE;
      --accent-ink: #92D6D9;
      --accent-wash: #0F2729;
      --mark: #E8863F;
      --mark-glow: rgba(232, 134, 63, .20);
    }
  }
  :root[data-theme="dark"] {
    --stage: #0A1114;
    --panel: #131E23;
    --ink: #EAF1F3;
    --muted: #93A6AE;
    --faint: #6E828B;
    --line: #1E2C33;
    --rule: #2A3C44;
    --accent: #5CBABE;
    --accent-ink: #92D6D9;
    --accent-wash: #0F2729;
    --mark: #E8863F;
    --mark-glow: rgba(232, 134, 63, .20);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--stage); color: var(--ink);
    font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app {
    height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: 0;
  }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    padding: 14px 24px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  .chap {
    font: 500 10.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase;
    color: var(--accent); white-space: nowrap;
  }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(17px, 2.3vw, 24px);
    letter-spacing: -.015em; margin: 0; line-height: 1.2; flex: 1 1 260px; min-width: 0;
  }
  .where { font: 400 12px/1 var(--mono); color: var(--faint); white-space: nowrap; }

  /* ── Stage ────────────────────────────────────────────────── */
  #stage { position: relative; overflow: hidden; margin: 18px 24px 0; }
  #plate {
    position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
    background: #FFFFFF; border: 1px solid var(--line);
  }
  #shot {
    position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform;
    transition: transform .62s cubic-bezier(.22,.61,.36,1);
  }
  .box {
    position: absolute; border: 2px solid var(--mark); border-radius: 4px;
    box-shadow: 0 0 0 3px var(--mark-glow), 0 0 0 9999px rgba(8, 17, 20, .40);
    transition: opacity .3s ease; pointer-events: none;
  }
  /* A title card replaces the plate on the opening and closing steps. */
  #card {
    position: absolute; inset: 0; display: none; place-content: center;
    padding: 6vh 8vw; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px;
  }
  #card.on { display: grid; }
  #card p.eyebrow {
    font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 18px;
  }
  #card h2 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(26px, 4.4vw, 46px);
    line-height: 1.12; letter-spacing: -.022em; margin: 0 0 20px; text-wrap: balance;
  }
  #card dl {
    display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0;
    font-size: 14px; max-width: 46ch;
  }
  #card dt {
    font: 500 10.5px/1.6 var(--sans); letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent);
  }
  #card dd { margin: 0; color: var(--muted); }

  /* ── Caption ──────────────────────────────────────────────── */
  #caption {
    margin: 16px 24px 0; padding: 16px 20px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: clamp(15px, 1.6vw, 20px); line-height: 1.55;
    max-height: 26vh; overflow-y: auto;
  }
  #caption s { color: var(--faint); opacity: .55; text-decoration: none; }
  #caption b { color: var(--ink); font-weight: 500; }

  /* ── Transport ────────────────────────────────────────────── */
  footer { padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn {
    font: 500 13px/1 var(--sans); color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #FFFFFF; }
  .btn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:hover { border-color: var(--rule); color: var(--ink); }
  .clock {
    font: 400 12.5px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
    white-space: nowrap;
  }
  .rail { display: flex; gap: 3px; flex: 1 1 220px; min-width: 140px; }
  .tick {
    flex: 1 1 0; height: 20px; padding: 0; border: 0; background: transparent; cursor: pointer;
  }
  .tick i {
    display: block; height: 4px; border-radius: 2px; background: var(--rule);
    transition: background .2s ease;
  }
  .tick[data-state="done"] i { background: var(--accent); }
  .tick[data-state="now"] i { background: var(--mark); height: 6px; margin-top: -1px; }
  .tick:hover i { background: var(--accent-ink); }
  .hint { font: 400 11.5px/1.5 var(--sans); color: var(--faint); white-space: nowrap; }

  @media (max-width: 720px) {
    header { padding: 10px 14px 9px; }
    #stage { margin: 12px 14px 0; }
    #caption { margin: 12px 14px 0; padding: 12px 14px; max-height: 30vh; }
    footer { padding: 10px 14px; gap: 8px; }
    .hint { display: none; }
  }
  /* ?record=1 drives the timeline from a clock and hides the controls, so a headless
     capture does not depend on audio autoplay. */
  body.rec footer, body.rec .hint { display: none; }
  body.rec #caption { max-height: 30vh; }
  @media (prefers-reduced-motion: reduce) {
    #shot { transition: none; }
    .box { transition: none; }
  }
</style>

<script type="application/json" id="data">{"model": "en_US-hfc_male-medium", "title": "COPD Severity Prediction, End to End", "total": 435.6, "steps": [{"block": 0, "chapter": "Opening", "title": "COPD severity prediction, from model card to surveillance", "where": "", "audio": "play/00.mp4", "dur": 10.59, "sentences": [{"text": "This walkthrough follows one AI-based software medical device through a REALM node, from the manufacturer's model card to a regulator examining its performance after it reaches the market.", "start": 0.0, "end": 9.685, "img": null, "rects": []}], "card": {"eyebrow": "REALM-OS \u00b7 COPD walkthrough", "rows": [["Device", "COPD Severity Classifier v0.1.0, decision support"], ["Data", "A public teaching dataset of 101 patients, split 70 for training, 31 for test"], ["Path", "Describe, certify, onboard data, evaluate, explain, validate, record, monitor"]]}}, {"block": 0, "chapter": "Opening", "title": "COPD severity prediction, from model card to surveillance", "where": "", "audio": "play/01.mp4", "dur": 16.67, "sentences": [{"text": "The device predicts whether a patient with chronic obstructive pulmonary disease, COPD, has severe or end-stage disease.", "start": 0.0, "end": 7.563, "img": null, "rects": []}, {"text": "It is trained and tested on a public dataset of one hundred and one patients, and its post-market surveillance uses synthetic data.", "start": 8.113, "end": 15.07, "img": null, "rects": []}], "card": {"eyebrow": "REALM-OS \u00b7 COPD walkthrough", "rows": [["Device", "COPD Severity Classifier v0.1.0, decision support"], ["Data", "A public teaching dataset of 101 patients, split 70 for training, 31 for test"], ["Path", "Describe, certify, onboard data, evaluate, explain, validate, record, monitor"]]}}, {"block": 1, "chapter": "Part one", "title": "The device and what it claims", "where": "/cards/6", "audio": "play/02.mp4", "dur": 11.38, "sentences": [{"text": "The first step is to create a model card that describes the device and its intended use.", "start": 0.0, "end": 4.435, "img": "c1-card", "rects": [[0.0146, 0.1532, 0.7983, 0.316]]}, {"text": "Here, that use is decision support for adults with a confirmed COPD diagnosis.", "start": 4.985, "end": 9.783, "img": "c1-card", "rects": [[0.0146, 0.5071, 0.9709, 0.1327]]}]}, {"block": 2, "chapter": "Part one", "title": "Inputs and outcome", "where": "/models/3", "audio": "play/03.mp4", "dur": 25.26, "sentences": [{"text": "The model takes fifteen inputs, each mapped to a standard OMOP concept so that the node can find it in any hospital's data.", "start": 0.0, "end": 6.911, "img": "c1-inputs", "rects": []}, {"text": "They cover spirometry, such as FEV1 as a percentage of the predicted value; symptom scores, such as the COPD assessment test; and comorbidities, such as ischaemic heart disease.", "start": 7.461, "end": 18.77, "img": "c1-inputs", "rects": [[0.0176, 0.2873, 0.9648, 0.0437], [0.0176, 0.4186, 0.9648, 0.0437], [0.0176, 0.7247, 0.9648, 0.043]]}, {"text": "What it returns is a single probability of end stage COPD for that patient.", "start": 19.32, "end": 23.662, "img": "c1-inputs", "rects": [[0.0176, 0.8522, 0.9648, 0.0332]]}]}, {"block": 3, "chapter": "Part two", "title": "Onboarding and certification", "where": "/models/3", "audio": "play/04.mp4", "dur": 23.96, "sentences": [{"text": "REALM requires the device to be packaged as a self-contained Docker image.", "start": 0.0, "end": 3.715, "img": "c2-cert", "rects": []}, {"text": "When the manufacturer imports the image, the node's model factory certifies it.", "start": 4.265, "end": 8.401, "img": "c2-cert", "rects": [[0.044, 0.086, 0.2839, 0.0545]]}, {"text": "Conformance checks that the model answers the way its contract says.", "start": 8.951, "end": 12.12, "img": "c2-cert", "rects": [[0.044, 0.3083, 0.9121, 0.0957]]}, {"text": "The hermetic check serves it with the network off.", "start": 12.67, "end": 14.783, "img": "c2-cert", "rects": [[0.044, 0.6124, 0.9121, 0.0739]]}, {"text": "Finally, the factory verifies the manufacturer's signature over the image against the key the manufacturer enrolled when registering.", "start": 15.333, "end": 22.36, "img": "c2-cert", "rects": [[0.044, 0.8134, 0.9121, 0.1151]]}]}, {"block": 4, "chapter": "Part three", "title": "The test set, as OMOP", "where": "copd-severity-model/data", "audio": "play/05.mp4", "dur": 27.87, "sentences": [{"text": "The training split stays with the manufacturer.", "start": 0.0, "end": 2.45, "img": "c3-omop", "rects": []}, {"text": "Only the test set goes to the node, converted to the OMOP common data model with every feature coded to its concept.", "start": 3.0, "end": 8.958, "img": "c3-omop", "rects": []}, {"text": "The converter writes only the thirty-one held-out patients; the full load, for comparison, has all one hundred and one.", "start": 9.508, "end": 16.668, "img": "c3-omop", "rects": [[0.0139, 0.2638, 0.9722, 0.0678], [0.0139, 0.4673, 0.9722, 0.0678]]}, {"text": "Loading and registering it on the node follows the runbook, and the manufacturer signs a digest of its content with their own key, so that the node can later show who vouched for the data.", "start": 17.218, "end": 26.267, "img": "c3-omop", "rects": [[0.0139, 0.8364, 0.9722, 0.0678]]}]}, {"block": 5, "chapter": "Part three", "title": "The dataset on the node", "where": "/datasets/2", "audio": "play/06.mp4", "dur": 11.55, "sentences": [{"text": "Once onboarded, the test set appears on the node as thirty-one persons.", "start": 0.0, "end": 3.996, "img": "c3-dataset", "rects": [[0.0561, 0.3551, 0.8878, 0.0507]]}, {"text": "Its provenance is recorded with it: this data was provided by the manufacturer, not by a hospital.", "start": 4.546, "end": 9.95, "img": "c3-dataset", "rects": [[0.0561, 0.5399, 0.8878, 0.0507]]}]}, {"block": 6, "chapter": "Part three", "title": "Data at risk", "where": "/fitness/assessments/3", "audio": "play/07.mp4", "dur": 17.14, "sentences": [{"text": "The data factory then assesses the data's quality, including eleven conformance checks, all of which pass.", "start": 0.0, "end": 5.833, "img": "c3-fitness", "rects": [[0.0561, 0.5629, 0.8878, 0.1927]]}, {"text": "It finds all the inputs the model needs, but it still marks the data at risk: a reference standard is missing, so the severity label has not been independently confirmed.", "start": 6.383, "end": 15.54, "img": "c3-fitness", "rects": [[0.0561, 0.4578, 0.8878, 0.035], [0.0561, 0.5024, 0.8878, 0.035]]}]}, {"block": 7, "chapter": "Part four", "title": "Evaluating over the intended population", "where": "/evaluations/10", "audio": "play/08.mp4", "dur": 38.43, "sentences": [{"text": "Next comes the evaluation of the certified model on the held-out data.", "start": 0.0, "end": 3.553, "img": "c4-protocol", "rects": [[0.0149, 0.019, 0.6673, 0.0812]]}, {"text": "The model is evaluated against a labelled dataset, with end stage COPD as the target.", "start": 4.103, "end": 9.376, "img": "c4-protocol", "rects": [[0.0349, 0.1992, 0.6275, 0.0628], [0.0349, 0.2874, 0.6275, 0.059]]}, {"text": "Two performance claims are made.", "start": 9.926, "end": 11.424, "img": "c4-protocol", "rects": [[0.0349, 0.4537, 0.6275, 0.0945]]}, {"text": "The first is an AUROC, the area under the receiver operating characteristic curve, of at least point eight.", "start": 11.974, "end": 18.037, "img": "c4-protocol", "rects": []}, {"text": "The second is an AUPRC, the area under the precision recall curve, of at least point seven.", "start": 18.587, "end": 24.093, "img": "c4-protocol", "rects": []}, {"text": "AUPRC is particularly informative here, because only about a third of these patients are positive, and it captures the trade-off between detecting positive cases and raising false alarms more directly than AUROC does.", "start": 24.643, "end": 37.535, "img": "c4-protocol", "rects": []}]}, {"block": 7, "chapter": "Part four", "title": "Evaluating over the intended population", "where": "/evaluations/10", "audio": "play/09.mp4", "dur": 11.64, "sentences": [{"text": "Since every person in the dataset has a COPD diagnosis, the evaluation group admits all of them.", "start": 0.0, "end": 5.784, "img": "c4-protocol", "rects": [[0.0349, 0.3718, 0.6275, 0.0565]]}, {"text": "The fitness panel confirms that all fifteen features were found in the data.", "start": 6.334, "end": 10.038, "img": "c4-protocol", "rects": [[0.0349, 0.802, 0.6275, 0.0209]]}]}, {"block": 8, "chapter": "Part five", "title": "Performance", "where": "/evaluations/10", "audio": "play/10.mp4", "dur": 28.36, "sentences": [{"text": "The results are in, and both exceed the manufacturer's pre-registered claims: AUROC is point nine three, and AUPRC point eight six.", "start": 0.0, "end": 8.692, "img": "c5-results", "rects": [[0.0349, 0.1131, 0.088, 0.1454]]}, {"text": "However, with only thirty-one patients, the ninety-five per cent confidence interval for AUROC runs from point eight one to one, and for AUPRC from point six three to one.", "start": 9.242, "end": 20.21, "img": "c5-results", "rects": [[0.5814, 0.0542, 0.081, 0.0338], [0.1428, 0.1131, 0.088, 0.1454]]}, {"text": "The AUPRC claim is met on the point estimate, but its interval reaches well below the threshold of point seven.", "start": 20.76, "end": 26.765, "img": "c5-results", "rects": []}]}, {"block": 9, "chapter": "Part five", "title": "Subgroups", "where": "/evaluations/10", "audio": "play/11.mp4", "dur": 16.36, "sentences": [{"text": "The subgroup analysis reveals a further problem.", "start": 0.0, "end": 2.519, "img": "c5-results", "rects": []}, {"text": "No performance can be reported for patients aged forty to sixty-four, because there are too few of them to report with confidence.", "start": 3.069, "end": 9.608, "img": "c5-results", "rects": [[0.0349, 0.3862, 0.6275, 0.0246]]}, {"text": "This does not show that the device is unfair.", "start": 10.158, "end": 12.26, "img": "c5-results", "rects": []}, {"text": "It shows that the evidence cannot tell.", "start": 12.81, "end": 14.76, "img": "c5-results", "rects": []}]}, {"block": 10, "chapter": "Part five", "title": "Explanation", "where": "/evaluations/10", "audio": "play/12.mp4", "dur": 28.61, "sentences": [{"text": "Next, the feature importance panel shows which inputs the predictions depend on.", "start": 0.0, "end": 4.356, "img": "c5-results", "rects": []}, {"text": "The most important is FEV1 percent predicted, followed by FEV1 itself, a long way behind.", "start": 4.906, "end": 11.216, "img": "c5-results", "rects": [[0.0349, 0.5808, 0.6275, 0.0246], [0.0349, 0.6115, 0.6275, 0.0246]]}, {"text": "The model is, in effect, reading one spirometry value.", "start": 11.766, "end": 15.138, "img": "c5-results", "rects": []}, {"text": "The reason lies in the label.", "start": 15.688, "end": 17.162, "img": "c5-results", "rects": []}, {"text": "In this dataset, a single rule, FEV1 below fifty per cent of predicted, reproduces the severity label for one hundred of the one hundred and one patients.", "start": 17.712, "end": 27.008, "img": "c5-label", "rects": [[0.0139, 0.7095, 0.9722, 0.1205]]}]}, {"block": 11, "chapter": "Part six", "title": "Validation by the notified body", "where": "/reviews", "audio": "play/13.mp4", "dur": 17.94, "sentences": [{"text": "The notified body's review queue shows the submission, the manufacturer and the dataset it was evaluated on, with the node's measurements set against the declared claims, claim by claim.", "start": 0.0, "end": 9.424, "img": "c7-review", "rects": [[0.0349, 0.1821, 0.5648, 0.0578], [0.0349, 0.4364, 0.2496, 0.1908]]}, {"text": "Both are met, and the node's adjudication reads claims satisfied.", "start": 9.974, "end": 13.773, "img": "c7-review", "rects": [[0.0349, 0.6503, 0.9303, 0.0578]]}, {"text": "The assessor can accept or reject, with notes.", "start": 14.323, "end": 17.042, "img": "c7-review", "rects": [[0.0349, 0.7543, 0.9303, 0.1445]]}]}, {"block": 11, "chapter": "Part six", "title": "Validation by the notified body", "where": "/reviews", "audio": "play/14.mp4", "dur": 24.55, "sentences": [{"text": "A careful assessor would weigh that the claims are met on thirty-one patients from a teaching dataset, held out by the manufacturer itself; that the AUPRC interval reaches below the claim; that one age group cannot be assessed; and that the label has no reference standard and is reproduced by a single spirometry threshold.", "start": 0.0, "end": 17.147, "img": "c7-review", "rects": []}, {"text": "REALM does not make that judgement.", "start": 17.697, "end": 19.253, "img": "c7-review", "rects": []}, {"text": "It puts every one of those facts in front of the person who does.", "start": 19.803, "end": 22.949, "img": "c7-review", "rects": []}]}, {"block": 12, "chapter": "Part seven", "title": "The record on the ledger", "where": "/cards/6", "audio": "play/15.mp4", "dur": 19.09, "sentences": [{"text": "Every change in the card's lifecycle is recorded on a blockchain ledger.", "start": 0.0, "end": 3.297, "img": "c6-record", "rects": [[0.0146, 0.1748, 0.9709, 0.0721]]}, {"text": "The manufacturer created the card and submitted it for evaluation.", "start": 3.847, "end": 7.411, "img": "c6-record", "rects": [[0.0146, 0.391, 0.9709, 0.1369], [0.0146, 0.5279, 0.9709, 0.1405]]}, {"text": "The notified body validated it, and a regulator published it.", "start": 7.961, "end": 11.412, "img": "c6-record", "rects": [[0.0146, 0.6685, 0.9709, 0.1405], [0.0146, 0.809, 0.9709, 0.1405]]}, {"text": "Each of these steps can only be taken by a party holding that role, and each is signed with that party's own address.", "start": 11.962, "end": 17.491, "img": "c6-record", "rects": []}]}, {"block": 13, "chapter": "Part eight", "title": "Post-market oversight", "where": "/dashboard", "audio": "play/16.mp4", "dur": 11.68, "sentences": [{"text": "Once the device is on the market, the regulator watches it.", "start": 0.0, "end": 3.091, "img": "c8-oversight", "rects": []}, {"text": "The oversight dashboard lists every published model with its monitoring status, and this one carries a drift alert from window eight.", "start": 3.641, "end": 10.075, "img": "c8-oversight", "rects": [[0.0146, 0.6919, 0.9709, 0.257]]}]}, {"block": 14, "chapter": "Part eight", "title": "The drift series", "where": "/cards/6/monitoring", "audio": "play/17.mp4", "dur": 32.64, "sentences": [{"text": "Post-market surveillance runs over twelve monthly batches of five hundred synthetic patients.", "start": 0.0, "end": 4.609, "img": "c8-monitor", "rects": [[0.0561, 0.2148, 0.8878, 0.2893]]}, {"text": "An alert is raised when AUROC falls, or when the expected calibration error or the population stability index rises, beyond a set threshold.", "start": 5.159, "end": 13.721, "img": "c8-monitor", "rects": [[0.0561, 0.1903, 0.8878, 0.014]]}, {"text": "Through month seven, every batch is within bounds.", "start": 14.271, "end": 17.048, "img": "c8-monitor", "rects": [[0.0561, 0.7839, 0.8878, 0.0314]]}, {"text": "At month eight, AUROC falls, calibration error rises, and the population stability index jumps, all past their thresholds.", "start": 17.598, "end": 26.107, "img": "c8-monitor", "rects": [[0.0561, 0.8153, 0.8878, 0.0314]]}, {"text": "The patients have changed, and the model's risk scores no longer mean what they did.", "start": 26.657, "end": 31.037, "img": "c8-monitor", "rects": []}]}, {"block": 15, "chapter": "Part eight", "title": "What an average hides", "where": "/evaluations/13", "audio": "play/18.mp4", "dur": 21.96, "sentences": [{"text": "The same evaluation can be run on any surveillance cohort.", "start": 0.0, "end": 3.228, "img": "c8-subgroup", "rects": []}, {"text": "In this drifted cohort, the overall AUROC is lower, but still above the claim.", "start": 3.778, "end": 8.671, "img": "c8-subgroup", "rects": [[0.0349, 0.1131, 0.088, 0.0685]]}, {"text": "The subgroup analysis shows where the loss lies: performance holds for patients aged forty to sixty-four, and falls to point seven for those sixty-five and over.", "start": 9.221, "end": 17.817, "img": "c8-subgroup", "rects": [[0.0349, 0.3862, 0.6275, 0.0246], [0.0349, 0.42, 0.6275, 0.0246]]}, {"text": "An overall pass can conceal a failing population.", "start": 18.367, "end": 21.061, "img": "c8-subgroup", "rects": []}]}, {"block": 15, "chapter": "Part eight", "title": "What an average hides", "where": "/evaluations/13", "audio": "play/19.mp4", "dur": 16.43, "sentences": [{"text": "In a degraded cohort, the device misses outright.", "start": 0.0, "end": 2.928, "img": "c8-degraded", "rects": [[0.0349, 0.1341, 0.088, 0.1724]]}, {"text": "Its AUROC and AUPRC confidence intervals reach the claimed thresholds only at their upper ends.", "start": 3.478, "end": 9.411, "img": "c8-degraded", "rects": [[0.1428, 0.1341, 0.088, 0.0812]]}, {"text": "This is what post-market surveillance exists to catch, and the manufacturer will have to act on it.", "start": 9.961, "end": 14.828, "img": "c8-degraded", "rects": []}]}, {"block": 16, "chapter": "Closing", "title": "What the record shows", "where": "", "audio": "play/20.mp4", "dur": 23.46, "sentences": [{"text": "The manufacturer trained and packaged its device; the node certified it, and evaluated it on locally held data that never left the node.", "start": 0.0, "end": 7.378, "img": null, "rects": []}, {"text": "The evaluation showed how the device works and where the evidence is thin.", "start": 7.928, "end": 11.376, "img": null, "rects": []}, {"text": "A notified body validated it, and a regulator is watching its post-market performance.", "start": 11.926, "end": 16.839, "img": null, "rects": []}, {"text": "Every decision is recorded on an immutable ledger, signed by the party authorised to make it.", "start": 17.389, "end": 21.862, "img": null, "rects": []}], "card": {"eyebrow": "Closing", "rows": [["Real", "The model, its certificate, the hold-out evaluation, every computed figure, the ledger"], ["Synthetic", "The post-market cohorts and drift series, and the narration voice"], ["Not claimed", "External validation; a clinical cohort; REALM does not issue certificates"]]}}], "images": {"c1-card": {"src": "data:image/webp;base64,UklGRjzgAABXRUJQVlA4IDDgAACwyAKdASrcBe0BPmEuk0ekIqGhJDOKAIAMCWlu/GbO/WGKEUBKzYvBgD+k+r2vlPf//L1f+v73/N7+uwcNv/tpO6Rb3vfOvwb+Yf1v/A/rh/Sfjt8Y/Pv6N/hv17/t37Mezf4t8k/U/7h/if8R/Zv/V/pfiC/m/614iPQv4j/M/4/1M/in1u+x/2H/Ff6/+1fuD92P2T+6/379qP7h6N/m37R/iP8b+zn+E/eX7BfyD+Q/1/+1ftp/Zf3c9z3+N/xX+e73jTP9H/pP8l7Avpx8v/wn96/zX/S/xP73fJ/7P/iv7Z/mP+j/hf//8lfnP9O/wH90/w3/F/xf///6H6Afxn+a/43+4f4v/pf3z///9f7A/0H/O/w37y+lP9t/zH/I/xf5kfYF/Kf6t/xv7v/of2U+lL+H/6H+L/0H7b+1b8z/wv/Q/x/+k/+H+o////8/Qb+Sf0z/af3f/N/+//Jf///9fej///+x8B/3N//n/Z+F79sv/7/w//WRCxgo+090yB2RSWnqbBR9p7pkDsiktPU2Cj7T3TIHZFJaepsFH2numQOyKS09TYKPF9c9YtAmJ44yA508tShLzHUTipCPeOQNQFQ0C6B2RSWnqbBR9p7pkDsiktPU2Cj7T3TIHZFJaepsFH2numQOxWukH+BFwBYwDwgzc+yhPwclIHFHLQHyubE701kcgDc42X/6Cjw693DGMCBhICo4R73f3N5NHm+df1+xu18XupBtH4cr6a7yp9RlvV6tceXccm4/oZgUAzJI2vO6NQfvMAjqW7TsZm5ICwdhjibb1Y3n57AIsNAUQyKzKlRW4znECyIGcGsPmF2bfH+Gc29xuXqnqil7iCAeeX4y4sVjRtPJaE41PU2Cj7T3TIHZFJaepsFH2numQOyKS09TYKPtPdMgdkUlp6myTTBsF1MH/kI18ZiLLVGXJ4siktPU2Cj7T3TIHZFJaepsFH2numQOyKS09TYKPtPdMgdkUlp6mwUfae6ZA7IpLT1Ngo+090yB2RSWnqbBR9p7pkDsiktPU2Cj7T3TIHZFJaepryE+OMf5be05ZmLmMy5mwwvNuc+ni00m0ROp0jOTTKlKmx0NXSQKt8UAcVnxHanFUICjwcL3s5D31ecsn5alLnGnAeh5vuGsI+3HBpwnqYN3qfBNdYb59uc5iJ5KLSjCNMwRclrJU5lCuSyHv7JNlaxEJOplC2oCaiCyxs2YyPCPH+4xs3KTjHUWbLFqZFOus09kQlfJIbHAlJuRrASsUGZA34ttNt2l6OUvdv9IIOC1q4EtYo3V1HnH9dwB1oGhtZiPXoRqhfUDCX42bBVd9yA3jnTRPtZDfVuYyNZX9utdMcfT3VWC08/56GXijOOx3Tn5RcLNP277avHIOsscjhqLyizbO6O2UB7uhobFPPtzfTduTV007FXUxP+aZQDNzUCPqKzoyh3pXgywwdN0MSuLVwC9HamqAjTZzxGYApkeEB6lvy9ujtqx6KXI2dqkktilK/jWbJ32FkTJVHPjuxs+RVJQsXxQkBT2xBfa53ETdoqfFjF6hgIsn4BgnJN5SKXOSadKYwBJfm++/DZCcThbJ//LCGHSqlYBS04qjHwE49kUlp6mwUfae6Ib0Q7jOrQThGDuDY+ae61jOgbZyEMMoJ3Q94JO2w5ZYqDmdCfpOzx4A9h7F+EtW1QCyweYNQ+GypKS+cJvwBU4TdS+l3EgQBpmwYw5XViMGoQ5Nw1S0OpXhzZhgM6vGNiRvC+iRhR4OolLmtGyd0wvCnsbCCmWtIGc3QE8gT4vDuixMwOfJOy8svN2mkH7pOdxnpQFIDH <script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STEPS = DATA.steps, IMAGES = DATA.images;

  var $ = function (id) { return document.getElementById(id); };
  var shot = $("shot"), plate = $("plate"), stage = $("stage"), card = $("card");
  var caption = $("caption"), rail = $("rail");

  // cumulative offsets so the clock and rail read as one continuous run
  var offsets = [], total = 0;
  STEPS.forEach(function (s) { offsets.push(total); total += s.dur; });

  var audio = $("au");
  var REC = /[?&]record=1/.test(location.search);
  var step = 0, auto = true, curSentence = -1, curImg = null, boxes = [];
  var vLocal = 0;                       // virtual time within the step, record mode only

  function mmss(t) {
    t = Math.max(0, Math.round(t));
    var m = Math.floor(t / 60), s = t % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function buildRail() {
    STEPS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "tick";
      b.type = "button";
      b.title = s.chapter + ", step " + (i + 1);
      b.setAttribute("aria-label", b.title);
      b.appendChild(document.createElement("i"));
      b.addEventListener("click", function () { go(i, !audio.paused); });
      rail.appendChild(b);
    });
  }

  function paintRail() {
    [].forEach.call(rail.children, function (b, i) {
      b.dataset.state = i < step ? "done" : (i === step ? "now" : "todo");
    });
  }

  // Fit the shot into the stage, then zoom so the active highlights fill it.
  function layout() {
    var s = STEPS[step];
    var sent = s.sentences[Math.max(0, curSentence)] || s.sentences[0];
    var name = sent && sent.img;
    if (!name) { return; }
    var im = IMAGES[name];
    var C = stage.clientWidth, H = stage.clientHeight;
    if (!C || !H) { return; }
    var fit = Math.min(C / im.w, H / im.h);
    var dw = im.w * fit, dh = im.h * fit;
    shot.style.width = dw + "px";
    shot.style.height = dh + "px";

    var rects = (sent && sent.rects) || [];
    var k = 1, tx = (C - dw) / 2, ty = (H - dh) / 2;
    if (rects.length) {
      var x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      rects.forEach(function (r) {
        x0 = Math.min(x0, r[0]); y0 = Math.min(y0, r[1]);
        x1 = Math.max(x1, r[0] + r[2]); y1 = Math.max(y1, r[1] + r[3]);
      });
      var rw = (x1 - x0) * dw, rh = (y1 - y0) * dh;
      k = Math.min(C / rw, H / rh) * 0.82;
      k = Math.max(1, Math.min(k, 3.1));
      tx = C / 2 - k * (x0 + (x1 - x0) / 2) * dw;
      ty = H / 2 - k * (y0 + (y1 - y0) / 2) * dh;
      // never pull the image edges inside the stage
      if (k * dw > C) { tx = Math.min(0, Math.max(tx, C - k * dw)); } else { tx = (C - k * dw) / 2; }
      if (k * dh > H) { ty = Math.min(0, Math.max(ty, H - k * dh)); } else { ty = (H - k * dh) / 2; }
    }
    shot.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";

    boxes.forEach(function (b) { b.remove(); });
    boxes = rects.map(function (r) {
      var b = document.createElement("div");
      b.className = "box";
      b.style.left = (tx + k * r[0] * dw) + "px";
      b.style.top = (ty + k * r[1] * dh) + "px";
      b.style.width = (k * r[2] * dw) + "px";
      b.style.height = (k * r[3] * dh) + "px";
      plate.appendChild(b);
      return b;
    });
  }

  function paintCaption() {
    var s = STEPS[step];
    caption.innerHTML = "";
    var active = null;
    s.sentences.forEach(function (sn, i) {
      var el = document.createElement(i === curSentence ? "b" : "s");
      el.textContent = sn.text + " ";
      caption.appendChild(el);
      if (i === curSentence) { active = el; }
    });
    // a long paragraph can outgrow the caption box, so keep the spoken line in view
    if (active && caption.scrollHeight > caption.clientHeight) {
      caption.scrollTop = Math.max(
        0, active.offsetTop - caption.offsetTop
           - (caption.clientHeight - active.offsetHeight) / 2);
    }
  }

  function setSentence(i) {
    if (i === curSentence) { return; }
    curSentence = i;
    var name = (STEPS[step].sentences[Math.max(0, i)] || {}).img || null;
    if (name !== curImg) {
      curImg = name;
      if (name) { shot.src = IMAGES[name].src; }
    }
    paintCaption();
    layout();
  }

  // Card chapters (no capture) carry their own eyebrow and rows in the script, so the
  // player holds no walkthrough-specific text. The opening may ask for the runtime.
  function showCard(s) {
    var c = s.card || {};
    $("card-eyebrow").textContent = c.eyebrow || s.chapter;
    $("card-title").textContent = s.title;
    var meta = $("card-meta");
    meta.innerHTML = "";
    var rows = (c.rows || []).slice();
    if (s.block === 0) { rows.push(["Runtime", mmss(total) + " \u00b7 " + STEPS.length + " steps"]); }
    rows.forEach(function (r) {
      var dt = document.createElement("dt"); dt.textContent = r[0];
      var dd = document.createElement("dd"); dd.textContent = r[1];
      meta.appendChild(dt); meta.appendChild(dd);
    });
  }

  function go(i, play) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    var s = STEPS[step];
    $("chap").textContent = s.chapter;
    $("title").textContent = s.title;
    $("where").textContent = s.where;

    var hasImg = !!s.sentences[0].img;
    card.classList.toggle("on", !hasImg);
    plate.style.display = hasImg ? "" : "none";
    if (!hasImg) { showCard(s); }

    curSentence = -1;
    curImg = null;
    boxes.forEach(function (b) { b.remove(); });
    boxes = [];
    setSentence(0);
    paintRail();

    if (!REC) {
      audio.src = s.audio;
      audio.currentTime = 0;
      if (play) { audio.play().catch(stopped); } else { stopped(); }
      var nx = STEPS[step + 1];        // warm the next clip
      if (nx) { var a = new Audio(); a.preload = "auto"; a.src = nx.audio; }
    }
    tick();
  }

  function tick() {
    var el = offsets[step] + (REC ? vLocal : (audio.currentTime || 0));
    $("clock").textContent = mmss(el) + " / " + mmss(total);
  }

  function playing() { $("play").textContent = "Pause"; }
  function stopped() { $("play").textContent = "Play"; }

  audio.addEventListener("play", playing);
  audio.addEventListener("pause", stopped);
  audio.addEventListener("timeupdate", function () {
    var t = audio.currentTime, sents = STEPS[step].sentences, idx = 0;
    for (var i = 0; i < sents.length; i++) { if (t >= sents[i].start) { idx = i; } }
    setSentence(idx);
    tick();
  });
  audio.addEventListener("ended", function () {
    stopped();
    if (!auto) { return; }
    if (step < STEPS.length - 1) { go(step + 1, true); } else { paintRail(); }
  });

  $("play").addEventListener("click", function () {
    if (audio.paused) { audio.play().catch(stopped); } else { audio.pause(); }
  });
  $("prev").addEventListener("click", function () { go(step - 1, !audio.paused); });
  $("next").addEventListener("click", function () { go(step + 1, !audio.paused); });
  $("auto").addEventListener("click", function () {
    auto = !auto;
    $("auto").setAttribute("aria-pressed", String(auto));
    $("auto").textContent = auto ? "Auto-advance" : "Step by step";
  });

  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { return; }
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); go(step + 1, !audio.paused); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(step - 1, !audio.paused); }
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen().catch(function () {}); }
    }
  });

  var t = null;
  window.addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(layout, 90);
  });

  function record() {
    document.body.classList.add("rec");
    var t0 = null;
    function frame(now) {
      if (t0 === null) { t0 = now; }
      var t = (now - t0) / 1000;
      if (t >= total) {
        vLocal = STEPS[STEPS.length - 1].dur;
        tick();
        document.title = "done";      // the recorder waits for this
        return;
      }
      var i = 0;
      for (var k = 0; k < STEPS.length; k++) { if (t >= offsets[k]) { i = k; } }
      if (i !== step) { go(i, false); }
      vLocal = t - offsets[i];
      var sents = STEPS[i].sentences, idx = 0;
      for (var j = 0; j < sents.length; j++) { if (vLocal >= sents[j].start) { idx = j; } }
      setSentence(idx);
      tick();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  buildRail();
  go(0, false);
  if (REC) { setTimeout(record, 1200); }   // let fonts and the first image settle
})();
</script>
</body>
</html>
